<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#111217">
<title>Falling Pixels</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ------------------------------------------------------------------ the look
   Same idea as THEME in sand_interactive.py: every colour lives here.
   Dark is the main look (it's your original palette); light is for phones set to light mode. */
:root {
  --bg: #eceef3;  --card: #ffffff;  --outline: #d3d7e2;  --button: #e3e6ee;
  --button-hover: #d6dbe7;  --accent: #2f6fe0;  --accent-dim: #cddcf8;
  --text: #1a1c24;  --text-dim: #646b7e;  --danger: #d9434f;  --track: #cfd4df;
  --shadow: rgba(20, 24, 36, .18);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111217;  --card: #1b1d25;  --outline: #303442;  --button: #282b37;
    --button-hover: #3a3f52;  --accent: #6ea8ff;  --accent-dim: #2a426e;
    --text: #e8eaf2;  --text-dim: #8c92a5;  --danger: #ff6969;  --track: #343846;
    --shadow: #0b0c10;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111217;  --card: #1b1d25;  --outline: #303442;  --button: #282b37;
  --button-hover: #3a3f52;  --accent: #6ea8ff;  --accent-dim: #2a426e;
  --text: #e8eaf2;  --text-dim: #8c92a5;  --danger: #ff6969;  --track: #343846;
  --shadow: #0b0c10;
  color-scheme: dark;
}

/* ------------------------------------------------------------------ page frame
   The phone draws the page under its status/nav bars; these paddings keep us clear of them. */
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; background: var(--bg); }
body {
  margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font-family: "Rubik", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  overscroll-behavior: none;              /* no pull-to-refresh while pouring */
  -webkit-tap-highlight-color: transparent;
  user-select: none; -webkit-user-select: none;
}
button { font: inherit; color: inherit; }

/* three stacked rows: top bar / sand / tools */
.app { height: 100%; display: grid; grid-template-rows: auto 1fr auto; gap: 10px; padding: 10px 12px 12px; }

/* ---- top bar ---- */
.top { display: flex; align-items: center; gap: 10px; }
.top h1 { font-size: 19px; font-weight: 600; margin: 0 auto 0 2px; letter-spacing: -0.01em; }
.segmented {
  display: grid; grid-template-columns: 1fr 1fr; background: var(--button);
  border: 1px solid var(--outline); border-radius: 10px; padding: 3px; position: relative;
}
.segmented button {
  border: 0; background: none; padding: 7px 14px; font-size: 14px; color: var(--text-dim);
  border-radius: 7px; position: relative; z-index: 1; transition: color .2s;
}
.segmented button[aria-pressed="true"] { color: var(--text); }
.segmented .thumb {                       /* the highlight slides between the two options */
  position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc(50% - 3px);
  background: var(--accent-dim); border-radius: 7px; transition: transform .25s cubic-bezier(.3,.7,.2,1);
}
.segmented[data-value="1"] .thumb { transform: translateX(100%); }

.icon-btn {
  width: 40px; height: 40px; display: grid; place-items: center; border-radius: 10px;
  background: var(--button); border: 1px solid var(--outline);
  transition: background .15s, border-color .15s, transform .1s;
}
.icon-btn:active { transform: scale(.92); background: var(--button-hover); }
.icon-btn svg { width: 20px; height: 20px; }

/* ---- the sand view ---- */
.stage { position: relative; min-height: 0; display: grid; place-items: center; }
canvas#sim {
  display: block; border-radius: 14px; outline: 1px solid var(--outline);
  image-rendering: pixelated; image-rendering: crisp-edges;
  touch-action: none;                      /* fingers draw sand instead of scrolling/zooming */
}
.pill {
  position: absolute; top: 10px; left: 10px; max-width: calc(100% - 20px);
  padding: 5px 13px; border-radius: 999px; font-size: 13px;
  background: color-mix(in srgb, var(--card) 88%, transparent); border: 1px solid var(--outline);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none;
}
.toast {
  position: absolute; left: 50%; bottom: 18px; transform: translate(-50%, 8px); opacity: 0;
  padding: 9px 18px; border-radius: 12px; font-size: 15px; white-space: nowrap;
  background: var(--card); border: 1px solid var(--accent); pointer-events: none;
  transition: opacity .3s, transform .3s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---- tool grid: 11 tools + settings = 2 rows of 6 ---- */
/* min-height reserves room for the 2 rows BEFORE the script adds the buttons,
   so the sand grid is sized to the space that's really left over */
.tools { display: grid; grid-template-columns: repeat(6, 1fr); gap: 7px; min-height: 123px; }
.tool {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; height: 58px; padding: 0; border-radius: 11px;
  background: var(--button); border: 1px solid var(--outline); color: var(--text-dim);
  box-shadow: 0 3px 0 var(--shadow);
  transition: background .18s, border-color .18s, color .18s, transform .08s, box-shadow .08s;
}
.tool svg { width: 24px; height: 24px; }
.tool span { font-size: 11.5px; }
.tool .key { position: absolute; top: 3px; right: 6px; font-size: 10px; color: var(--text-dim); display: none; }
/* pressed: the button sinks into its shadow (same as the 2px "press_t" sink in pygame) */
.tool:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--shadow); }
.tool[aria-pressed="true"] { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
.tool[aria-pressed="true"] span { color: var(--text); }
.tool.settings { color: var(--text); }

/* Hover only exists with a real mouse - phones skip these rules entirely */
@media (hover: hover) {
  .tool:hover { background: var(--button-hover); color: var(--text); }
  .tool[aria-pressed="true"]:hover { background: var(--accent-dim); }
  .icon-btn:hover, .btn:hover { background: var(--button-hover); border-color: color-mix(in srgb, var(--accent) 60%, var(--outline)); }
  .tool .key { display: block; }
}

/* ---- bottom sheets (settings, scenes) ---- */
.scrim {
  position: fixed; inset: 0; background: rgba(0,0,0,.45); opacity: 0; pointer-events: none;
  transition: opacity .25s; z-index: 10;
}
.scrim.open { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; max-height: 78%;
  display: flex; flex-direction: column; background: var(--card);
  border-top: 1px solid var(--outline); border-radius: 20px 20px 0 0;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  transform: translateY(105%); transition: transform .32s cubic-bezier(.3,.7,.2,1);
  max-width: 560px; margin: 0 auto;
}
.sheet.open { transform: translateY(0); }
.sheet-head { display: flex; align-items: center; padding: 8px 18px 6px; position: relative; }
.sheet-head::before {                     /* grab handle */
  content: ""; position: absolute; top: 7px; left: 50%; width: 38px; height: 4px; margin-left: -19px;
  border-radius: 2px; background: var(--outline);
}
.sheet-head h2 { margin: 14px 0 4px; font-size: 20px; font-weight: 600; flex: 1; }
.sheet-body { overflow-y: auto; padding: 4px 18px 20px; overscroll-behavior: contain; }

.section-title {
  display: flex; align-items: center; gap: 10px; margin: 16px 0 8px;
  font-size: 13px; font-weight: 500; color: var(--text-dim);
}
.section-title::after { content: ""; flex: 1; height: 1px; background: var(--outline); }

.btn {
  border: 1px solid var(--outline); background: var(--button); border-radius: 10px;
  padding: 11px 12px; font-size: 15px; transition: background .15s, border-color .15s, transform .08s;
}
.btn:active { transform: scale(.97); background: var(--button-hover); }
.btn.primary { background: var(--accent-dim); border-color: var(--accent); }
.btn.danger { color: var(--danger); }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }

/* ---- sliders: filled track + knob that grows while you hold it ---- */
.slider { margin: 4px 0 10px; }
.slider .label { display: flex; justify-content: space-between; font-size: 15px; margin-bottom: 2px; }
.slider .label b { font-weight: 500; color: var(--accent); font-variant-numeric: tabular-nums; }
input[type=range] {
  -webkit-appearance: none; appearance: none; width: 100%; height: 30px; margin: 0;
  background: transparent; --p: 50%;
}
input[type=range]::-webkit-slider-runnable-track {
  height: 6px; border-radius: 3px;
  background: linear-gradient(to right, var(--accent) var(--p), var(--track) var(--p));
}
input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: var(--track); }
input[type=range]::-moz-range-progress { height: 6px; border-radius: 3px; background: var(--accent); }
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 22px; height: 22px; margin-top: -8px; border-radius: 50%; border: 0;
  background: radial-gradient(circle, var(--accent) 0 32%, #f2f4fa 36%);
  box-shadow: 0 2px 0 var(--shadow); transition: transform .15s;
}
input[type=range]::-moz-range-thumb {
  width: 22px; height: 22px; border-radius: 50%; border: 0;
  background: radial-gradient(circle, var(--accent) 0 32%, #f2f4fa 36%); box-shadow: 0 2px 0 var(--shadow);
}
input[type=range]:active::-webkit-slider-thumb { transform: scale(1.25); }
input[type=range]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* ---- colour swatches ---- */
.swatch { margin: 4px 0 12px; }
.swatch .label { display: flex; justify-content: space-between; font-size: 15px; margin-bottom: 7px; }
.swatch .label code { font-family: inherit; font-size: 13px; color: var(--text-dim); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--outline); padding: 0;
  transition: transform .12s, box-shadow .12s;
}
.chip:active { transform: scale(.9); }
.chip[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--accent); }
.chip.custom { position: relative; overflow: hidden;
  background: conic-gradient(#f55, #fd5, #5e7, #5de, #66f, #e5f, #f55); }
.chip.custom input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }

/* ---- scene browser ---- */
.scene-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile { position: relative; border: 0; padding: 0; background: none; text-align: left; }
.tile img, .tile .noimg {
  width: 100%; aspect-ratio: var(--ar, 3/4); object-fit: cover; display: block;
  border-radius: 10px; outline: 1px solid var(--outline); background: var(--bg);
}
.tile:active img { outline: 2px solid var(--accent); }
.tile .name { font-size: 14px; margin-top: 6px; }
.tile .when { font-size: 12px; color: var(--text-dim); }
.tile .del {
  position: absolute; top: 6px; right: 6px; height: 28px; min-width: 28px; padding: 0 8px;
  border-radius: 14px; border: 1px solid var(--outline); font-size: 13px;
  background: color-mix(in srgb, var(--card) 85%, transparent); transition: background .15s, color .15s;
}
.tile .del.armed { background: var(--danger); color: #fff; border-color: var(--danger); }
.empty { color: var(--text-dim); font-size: 15px; line-height: 1.5; padding: 18px 0 8px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0s !important; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <a class="icon-btn" href="index.html" aria-label="Home" style="color:inherit">
      <svg viewBox="-12 -12 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 -8 L-4 0 L4 8"/></svg>
    </a>
    <h1>Falling Pixels</h1>
    <div class="segmented" id="material" data-value="0" role="group" aria-label="Material">
      <div class="thumb"></div>
      <button aria-pressed="true" data-v="0">Sand</button>
      <button aria-pressed="false" data-v="1">Water</button>
    </div>
    <button class="icon-btn" id="clearBtn" aria-label="Clear sand (keeps objects)">
      <svg viewBox="-12 -12 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-8 -3 A8.5 8.5 0 1 1 -6 6"/><path d="M-8 -9 V-3 H-2"/>
      </svg>
    </button>
  </header>

  <main class="stage" id="stage">
    <canvas id="sim"></canvas>
    <div class="pill" id="pill">Pour</div>
    <div class="toast" id="toast"></div>
  </main>

  <nav class="tools" id="tools" aria-label="Tools"></nav>
</div>

<div class="scrim" id="scrim"></div>

<section class="sheet" id="settings" aria-label="Settings">
  <div class="sheet-head"><h2>Settings</h2><button class="btn primary" data-close>Done</button></div>
  <div class="sheet-body" id="settingsBody"></div>
</section>

<section class="sheet" id="scenes" aria-label="Saved scenes">
  <div class="sheet-head"><h2>Load a scene</h2><button class="btn" data-close>Close</button></div>
  <div class="sheet-body"><div id="sceneList"></div></div>
</section>

<script>
"use strict";
/* =====================================================================================
   PART 1 - THE PHYSICS  (a line-by-line port of sand.py)
   Python lists of lists became flat typed arrays: grid[y][x] is now grid[y * W + x].
   Colours are packed into one 32-bit number (0xAABBGGRR) so they can be copied straight
   into the screen's pixel buffer later.
   ===================================================================================== */
const EMPTY = 0, STATIC = 1, IN_AIR = 2, STACKING = 3, SOLID = 4, DRAIN = 5, EMITTER = 6, CONVEYOR = 7, STILL_WATER = 8;
const SAND = 0, WATER = 1;
const WATER_PATIENCE = 120;
const isObject = k => k >= SOLID && k <= CONVEYOR;                 // OBJECTS in sand.py
const isFirm = k => k === STATIC || k === SOLID || k === EMITTER || k === CONVEYOR || k === STILL_WATER;

const pack = (r, g, b) => ((255 << 24) | (b << 16) | (g << 8) | r) >>> 0;
const unpack = c => [c & 255, (c >>> 8) & 255, (c >>> 16) & 255];
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;
const DEFAULT_SAND = pack(230, 200, 120);

function shaded(rgb, shade) {                                         // random brighter / darker
  const k = rand(1 - shade, 1 + shade);
  return pack(Math.min(255, rgb[0] * k | 0), Math.min(255, rgb[1] * k | 0), Math.min(255, rgb[2] * k | 0));
}

class Grain {
  constructor(x, y, vx, vy, color = DEFAULT_SAND, kind = SAND) {
    this.x = x; this.y = y; this.vx = vx; this.vy = vy; this.status = IN_AIR;
    this.color = color; this.kind = kind; this.idle = 0;
  }
}

class Sand {
  constructor(w, h) {
    this.w = w; this.h = h;
    this.grid = new Uint8Array(w * h);
    this.colors = new Uint32Array(w * h);         // 0 = no colour
    this.grains = [];
    this.newlyStatic = [];                        // cell indices that just settled
    this.newlyWoken = [];                         // cell indices that started moving again
    this.drains = new Set();
    this.emitters = new Map();                    // cell -> {kind, color (packed) or null = live colour}
    this.conveyors = new Map();                   // cell -> +1 / -1
    this.gravity = 0.8; this.drag = 0.999; this.wind = 0; this.bounce = 0;
  }

  // ---------- small helpers ----------
  occupied(x, y) { const k = this.grid[y * this.w + x]; return k !== EMPTY && k !== IN_AIR; }
  put(x, y, v) {
    const i = y * this.w + x;
    if (v === EMPTY && isFirm(this.grid[i])) return;
    this.grid[i] = v;
  }
  lift(g) {
    const i = (g.y | 0) * this.w + (g.x | 0);
    if (this.grid[i] === g.status) this.grid[i] = EMPTY;
  }
  sweepY(x, y0, y1) {
    const step = y1 > y0 ? 1 : -1; let y = y0;
    while (y !== y1) {
      const nxt = y + step;
      if (nxt < 0 || nxt > this.h - 1 || this.occupied(x, nxt)) break;
      y = nxt;
    }
    return y;
  }
  sweepX(y, x0, x1) {
    const step = x1 > x0 ? 1 : -1; let x = x0;
    while (x !== x1) {
      const nxt = x + step;
      if (nxt < 0 || nxt > this.w - 1 || this.occupied(nxt, y)) break;
      x = nxt;
    }
    return x;
  }

  // ---------- adding / removing things ----------
  pour(x, y, n, rgb, spread, shade, kind) {
    x = clamp(x | 0, 0, this.w - 1); y = clamp(y | 0, 0, this.h - 1);
    while (y > 0 && this.occupied(x, y)) y--;
    if (this.occupied(x, y)) return;
    const i = y * this.w + x;
    for (let k = 0; k < n; k++) {
      this.grains.push(new Grain(x, y, rand(-spread, spread), rand(-spread, spread), shaded(rgb, shade), kind));
      if (this.grid[i] === EMPTY) this.grid[i] = IN_AIR;
    }
  }

  runEmitters(flow, liveColors, shade) {
    const W = this.w;
    for (const [i, e] of this.emitters) {
      const x = i % W, y = (i / W) | 0;
      if (this.emitters.has(i + W) || y + 1 >= this.h) continue;      // not on the underside
      if (this.grid[i + W] !== EMPTY || Math.random() > flow) continue;
      const rgb = e.color ? unpack(e.color) : liveColors[e.kind];
      this.grains.push(new Grain(x + 0.5, y + 1.5, rand(-0.15, 0.15), 0, shaded(rgb, shade), e.kind));
      this.grid[i + W] = IN_AIR;
    }
  }

  addSolid(cells, kind = SOLID, prop = null) {                        // cells: [[x, y], ...]
    const W = this.w, placed = [];
    for (const [x, y] of cells) {
      if (x >= 0 && x < W && y >= 0 && y < this.h) {
        const i = y * W + x;
        if (!isObject(this.grid[i])) { this.grid[i] = kind; this.colors[i] = 0; placed.push(i); }
      }
    }
    if (placed.length) {
      const inside = new Set(placed);
      this.grains = this.grains.filter(g => !inside.has((g.y | 0) * W + (g.x | 0)));
      const xs = placed.map(i => i % W), ys = placed.map(i => (i / W) | 0);
      const minX = Math.min(...xs), maxX = Math.max(...xs), maxY = Math.max(...ys);
      if (kind === DRAIN) {
        for (const i of placed) this.drains.add(i);
        this.wakeRegion(minX - 1, maxX + 1, maxY + 1);
      } else if (kind === EMITTER) {
        for (const i of placed) this.emitters.set(i, prop);
      } else if (kind === CONVEYOR) {
        for (const i of placed) this.conveyors.set(i, prop);
        this.wakeRegion(minX, maxX, maxY);
      }
    }
    return placed;
  }

  removeSolid(cells) {
    const W = this.w, removed = [];
    for (const [x, y] of cells) {
      if (x >= 0 && x < W && y >= 0 && y < this.h) {
        const i = y * W + x;
        if (isObject(this.grid[i])) {
          this.grid[i] = EMPTY;
          this.drains.delete(i); this.emitters.delete(i); this.conveyors.delete(i);
          removed.push(i);
        }
      }
    }
    if (removed.length) this.wakeAll();
    return removed;
  }

  touchesDrain(x, y) {
    const g = this.grid, W = this.w, H = this.h;
    const n = [[x, y + 1], [x - 1, y + 1], [x + 1, y + 1], [x - 1, y], [x + 1, y], [x, y - 1]];
    for (const [nx, ny] of n) if (nx >= 0 && nx < W && ny >= 0 && ny < H && g[ny * W + nx] === DRAIN) return true;
    return false;
  }

  wakeAll() { this.wakeRegion(0, this.w - 1, this.h - 1); }

  wakeRegion(x0, x1, yMax) {
    const W = this.w;
    x0 = Math.max(x0, 0); x1 = Math.min(x1, W - 1); yMax = Math.min(yMax, this.h - 1);
    for (let y = yMax; y >= 0; y--) {                               // bottom row first
      for (let x = x0; x <= x1; x++) {
        const i = y * W + x, k = this.grid[i];
        if (k === STATIC || k === STILL_WATER) {
          const g = new Grain(x + 0.5, y + 0.5, 0, 0, this.colors[i] || DEFAULT_SAND, k === STILL_WATER ? WATER : SAND);
          g.status = STACKING; this.grid[i] = STACKING;
          this.grains.push(g); this.newlyWoken.push(i);
        }
      }
    }
  }

  solidObject(x, y) {                                               // flood fill: the one thing you touched
    const W = this.w, H = this.h;
    if (!(x >= 0 && x < W && y >= 0 && y < H) || !isObject(this.grid[y * W + x])) return null;
    const kind = this.grid[y * W + x], start = y * W + x;
    const found = new Set([start]), todo = [start];
    while (todo.length) {
      const c = todo.pop(), cx = c % W, cy = (c / W) | 0;
      for (const [nx, ny] of [[cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]]) {
        const n = ny * W + nx;
        if (nx >= 0 && nx < W && ny >= 0 && ny < H && !found.has(n) && this.grid[n] === kind) { found.add(n); todo.push(n); }
      }
    }
    return found;
  }

  moveSolid(cells, dx, dy) {                                        // cells: Set of indices
    const W = this.w, H = this.h, moved = new Set();
    for (const i of cells) {
      const x = i % W + dx, y = ((i / W) | 0) + dy;
      if (x < 0 || x >= W || y < 0 || y >= H) return null;
      const n = y * W + x;

const shapeCache = new Map();
function shapeCells(name, r) {
  const key = name + r;
  if (shapeCache.has(key)) return shapeCache.get(key);
  const cells = [];
  if (name === "sphere") {
    for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) if (dx * dx + dy * dy <= r * r + 1) cells.push([dx, dy]);
  } else if (name === "cone") {
    for (let dy = -r; dy <= r; dy++) { const half = Math.floor((dy + r) / 2); for (let dx = -half; dx <= half; dx++) cells.push([dx, dy]); }
  } else if (name === "box") {
    for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) cells.push([dx, dy]);
  } else if (name === "emitter") {
    for (let dy = -1; dy <= 1; dy++) for (let dx = -r; dx <= r; dx++) cells.push([dx, dy]);
  } else if (name === "trash") {
    for (let dy = -2; dy <= 1; dy++) for (let dx = -r; dx <= r; dx++) cells.push([dx, dy]);
  } else if (name === "bowl") {
    for (let dy = 0; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
      const d2 = dx * dx + dy * dy;
      if ((r - 2) ** 2 <= d2 && d2 <= r * r) cells.push([dx, dy - Math.floor(r / 2)]);

}

  return out;
}

  const seen = new Set(), out = [];
  const dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx - dy, x = x0, y = y0;

    for (const ox of [0, 1]) for (const oy of [0, 1]) {
      const k = (x + ox) + "," + (y + oy);
      if (!seen.has(k)) { seen.add(k); out.push([x + ox, y + oy]); }
    }
    if (x === x1 && y === y1) break;
    const e2 = 2 * err;
    if (e2 > -dy) { err -= dy; x += sx; }
    if (e2 < dx) { err += dx; y += sy; }
  }
  return out;
}

        for (const [el, p] of chipEls) { const on = p.every((v, i) => v === c[i]); el.setAttribute("aria-pressed", on); matched ||= on; }
        custom.setAttribute("aria-pressed", !matched);
        custom.style.background = matched ? "" : toHex(c);
      } };
      sw.set(color);
      body.appendChild(wrap);
    }
  }
}
body.insertAdjacentHTML("beforeend", `<div class="section-title">Scenes</div>
  <div class="btn-row"><button class="btn primary" id="saveBtn">Save scene</button><button class="btn" id="loadBtn">Load scene</button></div>
  <div class="btn-row"><button class="btn" id="clearSandBtn">Clear sand</button><button class="btn danger" id="clearAllBtn">Clear everything</button></div>`);

// ---- sheets ----
const scrim = document.getElementById("scrim");
let openSheetId = null;
function openSheet(id) {
  if (openSheetId) document.getElementById(openSheetId).classList.remove("open");
  openSheetId = id;
  document.getElementById(id).classList.add("open"); scrim.classList.add("open");
  if (id === "scenes") renderSceneList();
}
function closeSheet() {
  if (!openSheetId) return;
  document.getElementById(openSheetId).classList.remove("open"); scrim.classList.remove("open");
  openSheetId = null;
}
scrim.addEventListener("click", closeSheet);
document.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", closeSheet));

// ---- actions ----
function clearSand() { sand.clearSand(); redrawStatic(); showToast("Sand cleared"); }
function clearAll() { sand = new Sand(W, H); staticBuf.fill(0); moving = dragStart = null; showToast("Cleared everything"); }
document.getElementById("clearBtn").addEventListener("click", () => { clearSand(); buzz(10); });
document.getElementById("clearSandBtn").addEventListener("click", () => { clearSand(); closeSheet(); });
document.getElementById("clearAllBtn").addEventListener("click", () => { clearAll(); closeSheet(); });
document.getElementById("saveBtn").addEventListener("click", () => { closeSheet(); saveScene(); });
document.getElementById("loadBtn").addEventListener("click", () => openSheet("scenes"));

// ---- tool label + toast ----
function updatePill() {
  let label = title(tool);
  if (tool === "pour" || tool === "emitter") label += material === WATER ? "  ·  water" : "  ·  sand";
  if (SHAPES.includes(tool) || tool === "erase") label += `  ·  size ${sliders.size ? sliders.size.value : ""}`;
  if (tool === "belt") label += "  ·  drag the way it should carry";
  if (tool === "ramp") label += "  ·  drag to draw";
  if (SHAPES.includes(tool)) label += "  ·  lift to place";
  pillEl.textContent = label;
}
let toastTimer = 0;
function showToast(text) {
  toastEl.textContent = text; toastEl.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2200);
}
updatePill();

/* ---------------------------------------------------------------- touch / mouse
   Pointer events cover fingers, mouse and stylus with one set of handlers.
   Shapes get placed when you LIFT your finger, so you can see the ghost and aim first. */
function toCell(e) {
  const r = canvas.getBoundingClientRect();
  pointer.cx = Math.floor((e.clientX - r.left) / r.width * W);
  pointer.cy = Math.floor((e.clientY - r.top) / r.height * H);
}
function emitterProp() {
  if (material === WATER) return { kind: WATER, color: pack(...THEME.water) };
  return { kind: SAND, color: sliders.hue.value === 0 ? pack(...swatches.sand.color) : null };
}
canvas.addEventListener("pointerdown", e => {
  if (pointer.id !== null) return;                                 // ignore a second finger
  pointer.id = e.pointerId; pointer.down = true;
  canvas.setPointerCapture(e.pointerId);
  toCell(e);
  const { cx, cy } = pointer;
  if (tool === "pour" || tool === "erase") holding = true;
  else if (tool === "ramp" || tool === "belt") dragStart = [cx, cy];
  else if (tool === "move") { moving = sand.solidObject(cx, cy); moveAnchor = [cx, cy]; if (moving) buzz(8); }
  else aiming = true;                                              // a shape: place it on release
});
canvas.addEventListener("pointermove", e => { toCell(e); pointer.hover = e.pointerType === "mouse"; });
canvas.addEventListener("pointerleave", () => { pointer.hover = false; });
function release(e, cancelled) {
  if (e.pointerId !== pointer.id) return;
  toCell(e);
  const cx = clamp(pointer.cx, 0, W - 1), cy = clamp(pointer.cy, 0, H - 1);
  if (!cancelled && aiming) {
    const kind = KIND[tool] ?? SOLID;
    paintCells(sand.addSolid(at(cx, cy, tool, sliders.size.value), kind, tool === "emitter" ? emitterProp() : null));
    buzz(12);
  }
  if (!cancelled && dragStart) {
    if (tool === "belt") {
      const dir = cx < dragStart[0] ? -1 : 1;
      paintCells(sand.addSolid(beltCells(dragStart[0], cx, dragStart[1]), CONVEYOR, dir));
    } else paintCells(sand.addSolid(lineCells(dragStart[0], dragStart[1], cx, cy)));
    buzz(12);
  }
  pointer.id = null; pointer.down = false;
  holding = aiming = false; dragStart = moving = null;
}
canvas.addEventListener("pointerup", e => release(e, false));
canvas.addEventListener("pointercancel", e => release(e, true));

// keyboard shortcuts still work if you open it on a computer
addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  const k = e.key.toLowerCase();
  if (k === "escape") closeSheet();
  else if (k === "r") clearSand();
  else if (k === "x") clearAll();
  else if (k === "w") setMaterial(1 - material);
  else if (k === "s") saveScene();
  else if (k === "l") openSheetId === "scenes" ? closeSheet() : openSheet("scenes");
  else if (TOOL_KEYS.includes(e.key)) selectTool(TOOLS[TOOL_KEYS.indexOf(e.key)]);
});

/* ---------------------------------------------------------------- main loop
   requestAnimationFrame runs at the screen's refresh rate (often 90 or 120 Hz on Android),
   so we only step the physics ~60 times a second, matching clock.tick(60) in pygame. */
let lastStep = 0;
function loop(now) {
  requestAnimationFrame(loop);
  if (now - lastStep < 15.5) return;
  lastStep = now;

  sand.gravity = sliders.gravity.value; sand.wind = sliders.wind.value; sand.bounce = sliders.bounce.value;
  let sandColor;
  if (sliders.hue.value === 0) { hueDrift = 0; sandColor = swatches.sand.color; }
  else {
    hueDrift = (hueDrift + sliders.hue.value / 600) % 1;
    const [h, s, v] = rgbToHsv(swatches.sand.color);
    sandColor = hsvToRgb((h + hueDrift) % 1, Math.max(s, 0.5), Math.max(v, 0.5));
  }
  const liveColors = { [SAND]: sandColor, [WATER]: THEME.water };
  const cx = pointer.cx, cy = pointer.cy;

  if (moving) {                                                    // Move tool: plough toward the finger
    const tx = clamp(cx, 0, W - 1), ty = clamp(cy, 0, H - 1);
    const dx = clamp(tx - moveAnchor[0], -3, 3), dy = clamp(ty - moveAnchor[1], -3, 3);
    for (const [sx, sy] of [[dx, dy], [dx, 0], [0, dy]]) {
      if (!sx && !sy) continue;
      const moved = sand.moveSolid(moving, sx, sy);
      if (moved) {
        for (const i of moving) if (!moved.has(i)) staticBuf[i] = 0;
        paintCells(moved);
        moving = moved; moveAnchor = [moveAnchor[0] + sx, moveAnchor[1] + sy];
        break;
      }
    }
  }

  if (holding && tool === "pour") {
    sand.pour(cx, cy, sliders.rate.value, liveColors[material], sliders.spread.value,
              material === WATER ? 0.06 : sliders.shade.value, material);
  } else if (holding && tool === "erase") {
    if (sand.removeSolid(at(cx, cy, "sphere", Math.max(2, sliders.size.value >> 1))).length) redrawStatic();
  }

  sand.runEmitters(sliders.flow.value, liveColors, sliders.shade.value);
  sand.step();

  for (const i of sand.newlyWoken) if (!isObject(sand.grid[i])) staticBuf[i] = 0;
  sand.newlyWoken.length = 0;
  for (const i of sand.newlyStatic) staticBuf[i] = sand.colors[i];
  sand.newlyStatic.length = 0;

  frameNo++;
  if (sand.conveyors.size && frameNo % 3 === 0) { beltPhase++; paintCells(sand.conveyors.keys()); }

  render();
}

function render() {
  const bg = pack(...swatches.bg.color);
  for (let i = 0; i < pixels.length; i++) pixels[i] = staticBuf[i] || bg;   // settled layer over background
  for (const g of sand.grains) pixels[(g.y | 0) * W + (g.x | 0)] = g.color; // moving grains on top

  // translucent ghost of what you're about to place
  const cx = pointer.cx, cy = pointer.cy, show = pointer.down || pointer.hover;
  let preview = null;
  if (moving) preview = [...moving].map(i => [i % W, (i / W) | 0]);
  else if (show) {
    const size = sliders.size.value;
    if (SHAPES.includes(tool)) preview = at(cx, cy, tool, size);
    else if (tool === "erase") preview = at(cx, cy, "sphere", Math.max(2, size >> 1));
    else if (tool === "ramp") preview = dragStart ? lineCells(dragStart[0], dragStart[1], cx, cy) : [[cx, cy]];
    else if (tool === "belt") preview = dragStart ? beltCells(dragStart[0], cx, dragStart[1]) : beltCells(cx, cx, cy);
  }
  if (preview) {
    const tint = tool === "erase" ? THEME.danger : THEME.accent, a = 105 / 255;
    for (const [x, y] of preview) {
      if (x < 0 || x >= W || y < 0 || y >= H) continue;
      const i = y * W + x, c = unpack(pixels[i]);
      pixels[i] = pack(...c.map((v, k) => (v + (tint[k] - v) * a) | 0));
    }
  }
  ctx.putImageData(image, 0, 0);
}
requestAnimationFrame(loop);

/* =====================================================================================
   PART 3 - SAVE / LOAD
   Same file format idea as save_scene(): 4 bytes a cell (what it is + its colour),
   zlib-compressed and base64'd. Scenes are stored privately for you in this artifact's
   database (falls back to the phone's local storage if that isn't available).
   ===================================================================================== */
const SAVE_CODE = { [STATIC]: 1, [STILL_WATER]: 2, [SOLID]: 4, [DRAIN]: 5, [EMITTER]: 6, [CONVEYOR]: 7 };
const LOAD_CODE = Object.fromEntries(Object.entries(SAVE_CODE).map(([k, v]) => [v, +k]));
const CHUNK = 180000;                                                // characters per stored piece

function toB64(u8) {
  let s = "";
  for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return btoa(s);
}
function fromB64(s) { const b = atob(s), u8 = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u8[i] = b.charCodeAt(i); return u8; }
async function zip(u8, dir) {
  const S = dir === "in" ? window.CompressionStream : window.DecompressionStream;
  const stream = new Blob([u8]).stream().pipeThrough(new S("deflate"));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

// two interchangeable places to keep scenes: same four functions, different storage
const localStore = {
  async list() { try { return JSON.parse(localStorage.getItem("fp:index") || "[]"); } catch (e) { return []; } },
  async save(meta, chunks) {
    chunks.forEach((c, i) => localStorage.setItem(`fp:${meta.id}:${i}`, c));
    const all = await this.list(); all.push(meta);
    localStorage.setItem("fp:index", JSON.stringify(all));
  },
  async chunks(meta) { return Array.from({ length: meta.chunks }, (_, i) => localStorage.getItem(`fp:${meta.id}:${i}`)); },
  async remove(meta) {
    for (let i = 0; i < meta.chunks; i++) localStorage.removeItem(`fp:${meta.id}:${i}`);
    localStorage.setItem("fp:index", JSON.stringify((await this.list()).filter(m => m.id !== meta.id)));
  },
};
function dbStore(col) {
  return {
    async list() { const s = await col.where("type", "==", "scene").get(); return s.docs.map(d => ({ ...d.data(), id: d.id })); },
    async save(meta, chunks) {
      for (let i = 0; i < chunks.length; i++) await col.doc(`${meta.id}_c${i}`).set({ type: "chunk", data: chunks[i] });
      await col.doc(meta.id).set(meta);
    },
    async chunks(meta) {
      return Promise.all(Array.from({ length: meta.chunks }, (_, i) => col.doc(`${meta.id}_c${i}`).get().then(s => s.data().data)));
    },
    async remove(meta) {
      await col.doc(meta.id).delete();
      for (let i = 0; i < meta.chunks; i++) await col.doc(`${meta.id}_c${i}`).delete();
    },
  };
}
const storeReady = (async () => {
  try {
    if (!window.claude || !window.claude.use) return localStore;
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!db || !user) return localStore;
    const id = await user.id();
    return id ? dbStore(db.collection("data/users/" + id)) : localStore;
  } catch (e) { return localStore; }
})();

let saving = false;
async function saveScene() {
  if (saving) return;
  saving = true;
  try {
    const store = await storeReady;
    const cells = new Uint8Array(W * H * 4);
    for (let i = 0; i < W * H; i++) {
      const code = SAVE_CODE[sand.grid[i]];
      if (code) {
        cells[i * 4] = code;
        if (code <= 2) { const c = sand.colors[i]; cells[i * 4 + 1] = c & 255; cells[i * 4 + 2] = (c >>> 8) & 255; cells[i * 4 + 3] = (c >>> 16) & 255; }
      }
    }
    const z = !!window.CompressionStream;
    const b64 = toB64(z ? await zip(cells, "in") : cells);
    const chunks = [];
    for (let i = 0; i < b64.length; i += CHUNK) chunks.push(b64.slice(i, i + CHUNK));

    const thumbW = 180, thumbH = Math.round(thumbW * H / W);          // little picture for the browser
    const t = document.createElement("canvas"); t.width = thumbW; t.height = thumbH;
    t.getContext("2d").drawImage(canvas, 0, 0, thumbW, thumbH);

    const existing = await store.list();
    const num = Math.max(0, ...existing.map(m => m.num || 0)) + 1;
    const meta = {
      type: "scene", id: "scene_" + Date.now(), num, created: Date.now(), w: W, h: H, z, chunks: chunks.length,
      thumb: t.toDataURL("image/jpeg", 0.75),
      emitters: [...sand.emitters].map(([i, e]) => [i % W, (i / W) | 0, e.kind, e.color ? unpack(e.color) : null]),
      conveyors: [...sand.conveyors].map(([i, d]) => [i % W, (i / W) | 0, d]),
      sliders: Object.fromEntries(Object.entries(sliders).map(([k, s]) => [k, s.value])),
      colors: Object.fromEntries(Object.entries(swatches).map(([k, s]) => [k, s.color])),
      toggles: { material },
    };
    await store.save(meta, chunks);
    showToast(`Saved as Scene ${String(num).padStart(3, "0")}`);
  } catch (e) {
    showToast("Couldn't save: storage is full or unavailable");
  } finally { saving = false; }
}

async function loadScene(meta) {
  try {
    const store = await storeReady;
    let raw = fromB64((await store.chunks(meta)).join(""));
    if (meta.z) raw = await zip(raw, "out");
    // scenes saved on a different-shaped screen are pasted bottom-centre, edges trimmed
    const ox = Math.floor((W - meta.w) / 2), oy = H - meta.h;
    const fresh = new Sand(W, H);
    for (let s = 0; s < meta.w * meta.h; s++) {
      const code = raw[s * 4]; if (!code) continue;
      const x = (s % meta.w) + ox, y = ((s / meta.w) | 0) + oy;
      if (x < 0 || x >= W || y < 0 || y >= H) continue;
      const i = y * W + x, kind = LOAD_CODE[code];
      fresh.grid[i] = kind;
      if (code <= 2) fresh.colors[i] = pack(raw[s * 4 + 1], raw[s * 4 + 2], raw[s * 4 + 3]);
      else if (kind === DRAIN) fresh.drains.add(i);
    }
    const inside = (x, y) => x >= 0 && x < W && y >= 0 && y < H;
    for (const [x, y, k, c] of meta.emitters || []) if (inside(x + ox, y + oy)) fresh.emitters.set((y + oy) * W + x + ox, { kind: k, color: c ? pack(...c) : null });
    for (const [x, y, d] of meta.conveyors || []) if (inside(x + ox, y + oy)) fresh.conveyors.set((y + oy) * W + x + ox, d);
    for (const [k, v] of Object.entries(meta.sliders || {})) if (sliders[k]) sliders[k].set(v);
    for (const [k, v] of Object.entries(meta.colors || {})) if (swatches[k]) swatches[k].set(v);
    if (meta.toggles) setMaterial(meta.toggles.material || 0);
    sand = fresh; moving = dragStart = null;
    redrawStatic();
    showToast(`Loaded Scene ${String(meta.num).padStart(3, "0")}`);
  } catch (e) {
    showToast("Couldn't read that scene");
  }
}

async function renderSceneList() {
  const list = document.getElementById("sceneList");
  list.innerHTML = `<p class="empty">Loading…</p>`;
  let scenes = [];
  try { scenes = (await (await storeReady).list()).sort((a, b) => b.created - a.created); }
  catch (e) { list.innerHTML = `<p class="empty">Couldn't reach your saved scenes. Check your connection and open this again.</p>`; return; }
  if (!scenes.length) { list.innerHTML = `<p class="empty">No saved scenes yet. Build something, then tap Save scene in Settings.</p>`; return; }
  list.innerHTML = "";
  const grid = document.createElement("div"); grid.className = "scene-grid";
  for (const m of scenes) {
    const tile = document.createElement("div"); tile.className = "tile";
    tile.style.setProperty("--ar", `${m.w}/${m.h}`);
    const when = new Date(m.created).toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
    tile.innerHTML = `<button class="tile" style="width:100%">${m.thumb ? `<img alt="" src="${m.thumb}">` : `<div class="noimg"></div>`}
      <div class="name">Scene ${String(m.num).padStart(3, "0")}</div><div class="when">${when}</div></button>
      <button class="del" aria-label="Delete scene">✕</button>`;
    tile.querySelector("button.tile").addEventListener("click", () => { closeSheet(); loadScene(m); });
    const del = tile.querySelector(".del");
    del.addEventListener("click", async () => {                      // tap once to arm, again to delete
      if (!del.classList.contains("armed")) {
        del.classList.add("armed"); del.textContent = "Delete";
        setTimeout(() => { del.classList.remove("armed"); del.textContent = "✕"; }, 2500);
        return;
      }
      try { await (await storeReady).remove(m); tile.remove(); showToast("Scene deleted"); }
      catch (e) { showToast("Couldn't delete that scene"); }
    });
    grid.appendChild(tile);
  }
  list.appendChild(grid);
}
</script>
