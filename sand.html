<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111217">
<title>Falling Pixels</title>
<style>
/* Layout: one screen. Header, the sand canvas filling what is left, an optional controls sheet, then the tool dock. */
:root {
  --bg: #111217;          /* page ground */
  --card: #1b1d25;        /* sheet, dock */
  --outline: #303442;
  --button: #282b37;
  --button-hover: #3a3f52;
  --accent: #6ea8ff;      /* the one blue */
  --accent-dim: #2a426e;
  --text: #e8eaf2;
  --text-dim: #8c92a5;
  --track: #343846;
  --shadow: #0b0c10;
  --ui: system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html {
  height: 100%;
  padding-top: env(safe-area-inset-top, 0px);       /* keep clear of the notch and home bar */
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: var(--bg);
}
@supports (height: 100dvh) { html { height: 100dvh; } }   /* phone browsers: the visible height, not the tallest */
body {
  height: 100%;
  margin: 0;
  touch-action: manipulation;                        /* no double-tap zoom */
  background: var(--bg);
  color: var(--text);
  font: 14px/1.3 var(--ui);
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { display: flex; align-items: center; gap: 10px; min-width: 0; }
.top h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: .01em; white-space: nowrap; }
.pill {
  flex: 1; min-width: 0; text-align: center; padding: 4px 12px; border-radius: 13px;
  background: var(--card); border: 1px solid var(--outline); color: var(--text-dim);
  font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.btn {
  min-height: 40px; padding: 0 14px; border-radius: 10px; cursor: pointer;
  background: var(--button); border: 1px solid var(--outline);
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap;
}
.btn:hover { background: var(--button-hover); }
.btn:active { transform: translateY(1px); }
.btn.on { background: var(--accent-dim); border-color: var(--accent); }

#stage { flex: 1; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; }
/* The sandbox is a stack: the board's own background (colour or picture), then the ink canvas (pen drawings), then the sand canvas on top. */
#board {
  position: relative; border-radius: 12px; overflow: hidden; border: 1px solid var(--outline);
  background-color: #0a0a0e; background-size: cover; background-position: center;
  touch-action: none; -webkit-touch-callout: none;
}
#board canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#c { image-rendering: pixelated; touch-action: none; }
#toast {
  position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); max-width: 90%;
  padding: 8px 16px; border-radius: 12px; background: var(--card); border: 1px solid var(--accent);
  opacity: 0; transition: opacity .3s; pointer-events: none; text-align: center;
}
#toast.show { opacity: 1; }
#selbar {
  position: absolute; left: 50%; top: 10px; transform: translateX(-50%); display: flex; gap: 8px; z-index: 2;
  padding: 6px; border-radius: 14px; background: var(--card); border: 1px solid var(--accent);
}
#selbar .btn { min-height: 36px; }

#sheet {
  flex: none; height: 42%; overflow-y: auto; overscroll-behavior: contain;
  background: var(--card); border: 1px solid var(--outline); border-radius: 16px; padding: 4px 16px 16px;
  -webkit-user-select: none; user-select: none;
}
#sheet h2 {
  margin: 16px 0 8px; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  color: var(--text-dim); display: flex; align-items: center; gap: 10px;
}
#sheet h2::after { content: ""; flex: 1; height: 1px; background: var(--outline); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 40px; }
.slider { display: grid; gap: 2px; padding: 4px 0; }
.slider .lab { display: flex; justify-content: space-between; gap: 8px; }
.slider output { color: var(--accent); font-variant-numeric: tabular-nums; }
input[type=color] {
  width: 56px; height: 34px; padding: 0; border: 1px solid var(--outline); border-radius: 8px;
  background: var(--button); cursor: pointer;
}

input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 30px; background: transparent; margin: 0; touch-action: pan-y; }
input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: var(--track); }
input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: var(--track); }
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 22px; height: 22px; margin-top: -8px; border-radius: 50%;
  background: #dde3f2; border: 5px solid var(--accent); box-shadow: 0 2px 0 var(--shadow);
}
input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: #dde3f2; border: 5px solid var(--accent); }

.dock { display: grid; gap: 8px; position: relative; }
.popmenu {
  position: absolute; z-index: 5; display: grid; grid-template-columns: repeat(3, 62px); gap: 8px; padding: 8px;
  border-radius: 14px; background: var(--card); border: 1px solid var(--accent); box-shadow: 0 8px 24px rgba(0, 0, 0, .55);
}
.quick { display: flex; align-items: center; gap: 12px; min-width: 0; }
.seg { display: flex; flex: none; border-radius: 10px; background: var(--button); border: 1px solid var(--outline); padding: 2px; }
.seg button { border: 0; background: transparent; min-height: 34px; padding: 0 14px; border-radius: 8px; color: var(--text-dim); cursor: pointer; }
.seg button.on { background: var(--accent-dim); color: var(--text); }
.seg.wide { width: 100%; }
.seg.wide button { flex: 1; }
.note { margin: 6px 0 0; color: var(--text-dim); font-size: 12px; }
/* the Size control: a small inline "Size ---o 8" instead of a full-width slider with its label stacked on top */
.pen { display: flex; align-items: center; gap: 8px; flex: none; }
.pen input[type=color] { width: 44px; }
.pair { display: flex; gap: 8px; }
.row .btn { min-height: 34px; }
.seg.compact button { padding: 0 11px; }
.dimlabel { color: var(--text-dim); font-size: 13px; white-space: nowrap; }
.mini {
  min-height: 26px; padding: 0 10px; border-radius: 8px; font-size: 12px; letter-spacing: 0; text-transform: none;
  background: var(--button); border: 1px solid var(--outline); color: var(--text-dim); cursor: pointer;
}
.mini:hover { background: var(--button-hover); color: var(--text); }
#sheet h2 .mini { order: 2; }
.quick .slider { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; max-width: 230px; padding: 0; }
.quick .slider .lab { display: contents; }
.quick .slider .lab span { color: var(--text-dim); font-size: 13px; }
.quick .slider input { order: 1; flex: 1; min-width: 36px; height: 24px; }
.quick .slider output { order: 2; min-width: 1.4em; text-align: right; }
.quick input[type=range]::-webkit-slider-thumb { width: 18px; height: 18px; margin-top: -6px; border-width: 4px; }
.tools { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.tools::-webkit-scrollbar { display: none; }
.tool {
  flex: none; width: 62px; height: 62px; border-radius: 12px; cursor: pointer; position: relative;
  background: var(--button); border: 1px solid var(--outline); box-shadow: 0 3px 0 var(--shadow);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--text-dim);
}
.tool svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tool span { font-size: 11px; }
.tool.on { background: var(--accent-dim); border-color: var(--accent); color: var(--text); }
.tool.on svg { color: var(--accent); }
.tool.ctl { position: sticky; right: 0; margin-left: auto; box-shadow: 0 3px 0 var(--shadow), -14px 0 12px -2px var(--bg); }
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } .btn:active { transform: none; } }

/* Wide screens (a computer): the controls stay open as a side panel, like a desktop app, instead of sliding up from the bottom. */
@media (min-width: 860px) {
  body { display: grid; grid-template-columns: minmax(0, 1fr) 300px; grid-template-rows: auto minmax(0, 1fr) auto; gap: 8px 16px; }
  .top { grid-column: 1; grid-row: 1; }
  #stage { grid-column: 1; grid-row: 2; }
  .dock { grid-column: 1; grid-row: 3; min-width: 0; }
  #sheet { display: block !important; grid-column: 2; grid-row: 1 / 4; height: auto; min-height: 0; contain: size; }
  #ctlBtn { display: none; }
}
</style>
</head>
<body>

<header class="top">
  <a class="btn" href="index.html" aria-label="Home" style="padding:0 12px">&#8249;</a>
  <h1>Falling Pixels</h1>
  <div class="pill" id="label">Pour · sand</div>
  <button class="btn" id="shotBtn" aria-label="Save a picture of the sandbox" title="Save a picture of the sandbox" style="padding:0 12px">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
  </button>
</header>

<main id="stage">
  <div id="board">
    <canvas id="ink" aria-hidden="true"></canvas>
    <canvas id="c" aria-label="Sand simulation: touch and drag to use the selected tool"></canvas>
  </div>
  <div id="selbar" hidden>
    <button class="btn" id="selCopy">Copy</button><button class="btn" id="selDelete">Delete</button>
    <button class="btn" id="selDone">Done</button>
  </div>
  <div id="toast" role="status"></div>
</main>

<section id="sheet" hidden aria-label="Controls"></section>

<nav class="dock" id="dock" aria-label="Tools">
  <div class="quick">
    <div class="seg" id="matSeg" role="group" aria-label="Material">
      <button id="mSand" class="on">Sand</button><button id="mWater">Water</button>
    </div>
    <div class="pen" id="creatureTools" hidden>
      <input type="color" id="creatureColor" value="#7ddc6a" aria-label="Creature colour">
      <button class="btn on" id="creatureNatural" title="Use the creature's own colours">Natural</button>
      <div class="seg compact" id="creatureScaleSeg" role="group" aria-label="Creature size">
        <button data-s="1" class="on">1×</button><button data-s="2">2×</button><button data-s="3">3×</button><button data-s="4">4×</button>
      </div>
    </div>
    <div class="pen" id="sceneryTools" hidden>
      <span class="dimlabel">Scenery size</span>
      <div class="seg compact" id="sceneryScaleSeg" role="group" aria-label="Scenery size">
        <button data-s="1" class="on">1×</button><button data-s="2">2×</button><button data-s="3">3×</button><button data-s="4">4×</button><button data-s="5">5×</button><button data-s="6">6×</button>
      </div>
    </div>
    <div class="pen" id="penTools" hidden><input type="color" id="penColor" value="#ffffff" aria-label="Pen color"><button class="btn" id="penUndo">Undo</button></div>
    <div class="slider" id="sizeBox"><div class="lab"><span>Size</span><output id="sizeOut"></output></div><input type="range" id="sizeRange" aria-label="Size"></div>
    <button class="btn" id="bSnap" hidden aria-label="Ramp snapping">Snap: off</button>
  </div>
  <div class="tools" id="tools"></div>
</nav>

<script>
// If anything goes wrong, show the message on screen (handy when there's no developer console, like on a phone).
window.addEventListener("error", e => {
  const d = document.createElement("div");
  d.style.cssText = "position:fixed;left:8px;right:8px;top:8px;z-index:99;background:#5a1f26;color:#fff;padding:10px;border-radius:8px;font:12px monospace;white-space:pre-wrap;user-select:text";
  d.textContent = "Error: " + e.message + " (line " + e.lineno + ")";
  document.body.appendChild(d);
});
</script>
<script>
// ==== PHYSICS ====
// Grid cell states (same numbers as the Python version)
const EMPTY = 0, STATIC = 1, IN_AIR = 2, STACKING = 3, SOLID = 4, DRAIN = 5, EMITTER = 6, CONVEYOR = 7, STILL_WATER = 8;
const SAND = 0, WATER = 1;
const WATER_PATIENCE = 120;
const CREATURE = 9, FOOD = 10;                           // a creature's body, and a piece of food (see CREATURE_TYPES, FOOD_TYPES)
const FIRM = new Uint8Array(11);
[STATIC, SOLID, EMITTER, CONVEYOR, STILL_WATER, CREATURE, FOOD].forEach(k => { FIRM[k] = 1; });
const isBody = k => k === CREATURE || k === FOOD;        // things that live in the world but are not "objects" you can place and erase
const isObj = k => k >= SOLID && k <= CONVEYOR;
const trunc = Math.trunc;

// colours are packed into one number per pixel (r, g, b, opaque), ready to write into the canvas
const pack = (r, g, b) => ((255 << 24) | (b << 16) | (g << 8) | r) >>> 0;
const DEFAULT_COLOR = pack(230, 200, 120);
function shaded(rgb, shade) {
  const k = 1 - shade + Math.random() * 2 * shade;
  return pack(Math.min(255, (rgb[0] * k) | 0), Math.min(255, (rgb[1] * k) | 0), Math.min(255, (rgb[2] * k) | 0));
}

class Grain {
  constructor(x, y, vx, vy, color, kind) {
    this.x = x; this.y = y; this.vx = vx; this.vy = vy;
    this.status = IN_AIR; this.color = color; this.kind = kind; this.idle = 0;
  }
}

// ---- creatures: tiny pixel animals made of the same pixels as the sand ----
// rows: the sprite ("." = see-through, letters are colours: see PIXEL_COLORS). Sand treats the coloured pixels as solid.
// every: ticks between steps (smaller = faster).  step: the tallest ledge it climbs at 1x.  walk / rest: how long, in ticks (30 a second).
// likes: foods that make it grow.  water: "love" swims and splashes, "hate" avoids pools and runs from a soaking, "neutral" doesn't mind.  body: the colour letters a custom colour replaces, each with how bright it is.
const MAX_CREATURES = 30, MAX_FOODS = 40, MAX_SCALE = 4, VISION = 80;
const CREATURE_TYPES = {
  slime: { rows: ["..gggg..", ".gGGGGg.", "gGkGGkGg", "gGGGGGGg", "gGGGGGGg", ".gggggg."], every: 8, step: 2, walk: [40, 140], rest: [30, 120],
    likes: ["berry", "apple"], water: "love", body: { g: 0.6, G: 1 } },
  bunny: { rows: [".w...w.", ".w...w.", ".wwwww.", "wwwwwww", "wkwwwkw", "wwwpwww", ".wwwww.", ".w...w."], every: 3, step: 4, walk: [6, 15], rest: [25, 90],
    likes: ["carrot", "apple"], water: "hate", body: { w: 1 } },
  chick: { rows: ["..yyy..", ".yyyyy.", ".ykyky.", ".yyoyy.", "yyyyyyy", ".yyyyy.", "..o.o.."], every: 5, step: 3, walk: [30, 100], rest: [15, 60], peck: true,
    likes: ["seed", "berry"], water: "hate", body: { y: 1 } },
  bird: { rows: ["..bbb..", ".bbbbb.", ".bkbkb.", ".bbobb.", "bbbbbbb", "..o.o.."], flyRows: ["b.bbb.b", "bbbbbbb", ".bkbkb.", ".bbobb.", "..bbb..", "..o.o.."],
    fly: true, every: 2, step: 3, walk: [20, 60], rest: [30, 100], likes: ["seed", "berry"], water: "neutral", body: { b: 1 } },
  cat: { rows: ["oo....oo", "oooooooo", "okooooko", "oooppooo", "oOooooOo", ".oooooo.", ".oOooOo.", ".oo..oo."], every: 6, step: 6, walk: [30, 90], rest: [60, 220],
    likes: ["fish"], water: "hate", body: { o: 1, O: 0.65 } },
  dog: { rows: [".nnnnnnn.", "NnnnnnnnN", "NnknnnknN", "nnttkttnn", ".nnnpnnn.", ".nnnnnnn.", ".nn...nn.", ".nn...nn."], every: 3, step: 5, walk: [60, 200], rest: [20, 70],
    likes: ["bone"], water: "love", body: { n: 1, N: 0.65 } },
};
const FOOD_TYPES = {
  apple: { rows: [".g..", "rrrr", "rrrr", ".rr."] },
  berry: { rows: [".vv.", "vvvv", "vvvv", ".vv."] },
  carrot: { rows: [".gg.", "oooo", ".oo.", "..o."] },
  seed: { rows: [".t.", "ttt", ".t."] },
  fish: { rows: ["s..ss", "sssss", ".sss."] },
  bone: { rows: ["ww..ww", "wwwwww", "ww..ww"] },
};
const geomCache = new Map();
function geomOf(def, scale) {                            // a sprite blown up `scale` times: its width, height, silhouette and top edge
  let bySize = geomCache.get(def);
  if (!bySize) { bySize = {}; geomCache.set(def, bySize); }
  if (!bySize[scale]) {
    const w = def.rows[0].length * scale, h = def.rows.length * scale, mask = [], tops = Array(w).fill(-1);
    def.rows.forEach((row, ry) => [...row].forEach((ch, rx) => {
      if (ch === ".") return;
      for (let j = 0; j < scale; j++) for (let i = 0; i < scale; i++) {
        const dx = rx * scale + i, dy = ry * scale + j;
        mask.push([dx, dy]);
        if (tops[dx] < 0) tops[dx] = dy;                  // rows go top to bottom, so the first one found is the highest
      }
    }));
    bySize[scale] = { w, h, mask, tops };
  }
  return bySize[scale];
}
const creatureRand = ([lo, hi]) => lo + Math.floor(Math.random() * (hi - lo + 1));

class Sand {
  constructor(w, h) {
    this.w = w; this.h = h;
    this.grid = new Uint8Array(w * h);
    this.colors = new Uint32Array(w * h);       // colour of settled sand / water
    this.grains = [];                           // grains that are still moving
    this.drains = new Set();                    // cells of every trash object
    this.emitters = new Map();                  // cell -> [SAND/WATER, rgb or null = live colour]
    this.conveyors = new Map();                 // cell -> direction (+1 right, -1 left)
    this.gravity = 0.8; this.drag = 0.999; this.wind = 0; this.bounce = 0;
    this.creatures = []; this.foods = []; this.creatureSpeed = 1;                        // pixel creatures: {type, x, y, dir, mode, timer, ...}
  }

  occupied(x, y) { const k = this.grid[y * this.w + x]; return k !== EMPTY && k !== IN_AIR; }

  put(x, y, v) {
    const i = y * this.w + x;
    if (v === EMPTY && FIRM[this.grid[i]]) return;     // never erase settled sand or shapes
    this.grid[i] = v;
  }

  lift(g) {
    const i = trunc(g.y) * this.w + trunc(g.x);
    if (this.grid[i] === g.status) this.grid[i] = EMPTY;
  }

  sweepY(x, y0, y1) {
    const step = y1 > y0 ? 1 : -1;
    let y = y0;
    while (y !== y1) {
      const nxt = y + step;
      if (nxt < 0 || nxt > this.h - 1 || this.occupied(x, nxt)) break;
      y = nxt;
    }
    return y;
  }

  sweepX(y, x0, x1) {
    const step = x1 > x0 ? 1 : -1;
    let x = x0;
    while (x !== x1) {
      const nxt = x + step;
      if (nxt < 0 || nxt > this.w - 1 || this.occupied(nxt, y)) break;
      x = nxt;
    }
    return x;
  }

  // ---------- adding / removing things ----------
  pour(x, y, n, rgb, spread, shade, kind) {
    x = Math.min(Math.max(trunc(x), 0), this.w - 1);
    y = Math.min(Math.max(trunc(y), 0), this.h - 1);
    while (y > 0 && this.occupied(x, y)) y--;            // don't spawn inside the pile / a shape
    if (this.occupied(x, y)) return;
    for (let k = 0; k < n; k++) {
      this.grains.push(new Grain(x, y, (Math.random() * 2 - 1) * spread, (Math.random() * 2 - 1) * spread,
        shaded(rgb, shade), kind));
      const i = y * this.w + x;
      if (this.grid[i] === EMPTY) this.grid[i] = IN_AIR;
    }
  }

  runEmitters(flow, live, shade) {
    for (const [i, [kind, rgb]] of this.emitters) {
      const x = i % this.w, y = (i - x) / this.w;
      if (this.emitters.has(i + this.w) || y + 1 >= this.h) continue;   // not on the underside
      if (this.grid[i + this.w] !== EMPTY || Math.random() > flow) continue;
      this.grains.push(new Grain(x + 0.5, y + 1.5, (Math.random() * 2 - 1) * 0.15, 0, shaded(rgb || live[kind], shade), kind));
      this.grid[i + this.w] = IN_AIR;
    }
  }

  /** Turn cells ([x, y] pairs) into a shape / trash / emitter / belt. Returns the cell numbers that changed. */
  addSolid(cells, kind = SOLID, prop = null) {
    const w = this.w, h = this.h, placed = [];
    for (const [x, y] of cells) {
      if (x >= 0 && x < w && y >= 0 && y < h) {
        const i = y * w + x;
        if (!isObj(this.grid[i]) && !isBody(this.grid[i])) { this.grid[i] = kind; this.colors[i] = 0; placed.push(i); }
      }
    }
    if (placed.length) {
      const inside = new Set(placed);                    // moving grains swallowed by the shape vanish
      this.grains = this.grains.filter(g => !inside.has(trunc(g.y) * w + trunc(g.x)));
      let minX = w, maxX = 0, maxY = 0;
      for (const i of placed) {
        const x = i % w, y = (i - x) / w;
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y > maxY) maxY = y;
      }
      if (kind === DRAIN) {
        for (const i of placed) this.drains.add(i);
        this.wakeRegion(minX - 1, maxX + 1, maxY + 1);   // wake sand already touching it, so it gets eaten
      } else if (kind === EMITTER) {
        for (const i of placed) this.emitters.set(i, prop);
      } else if (kind === CONVEYOR) {
        for (const i of placed) this.conveyors.set(i, prop);
        this.wakeRegion(minX, maxX, maxY);               // sand on it starts riding
      }
    }
    return placed;
  }

  removeSolid(cells) {
    const w = this.w, h = this.h, removed = [];
    for (const [x, y] of cells) {
      if (x >= 0 && x < w && y >= 0 && y < h) {
        const i = y * w + x;
        if (isObj(this.grid[i])) {
          this.grid[i] = EMPTY; this.colors[i] = 0;
          this.drains.delete(i); this.emitters.delete(i); this.conveyors.delete(i);
          removed.push(i);
        }
      }
    }
    if (removed.length) this.wakeAll();                  // sand that lost its support must fall
    return removed;
  }

  // ---------- rectangle selection: copy / delete / paste ----------
  clipRect(x0, y0, x1, y1) {                             // order and clamp a rectangle's corners (inclusive)
    return [Math.max(Math.min(x0, x1), 0), Math.max(Math.min(y0, y1), 0),
      Math.min(Math.max(x0, x1), this.w - 1), Math.min(Math.max(y0, y1), this.h - 1)];
  }

  /** Snapshot the settled sand, water and objects in a rectangle. Grains still falling are left out. */
  copyRegion(x0, y0, x1, y1) {
    [x0, y0, x1, y1] = this.clipRect(x0, y0, x1, y1);
    const cells = [];
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
      const i = y * this.w + x, k = this.grid[i];
      if (k === STATIC || k === STILL_WATER) cells.push([x - x0, y - y0, k, this.colors[i], null]);

  }

  /** Empty a rectangle completely. Returns how many cells held something. */
  deleteRegion(x0, y0, x1, y1) {
    [x0, y0, x1, y1] = this.clipRect(x0, y0, x1, y1);
    let removed = 0;
    const w0 = this.w;                                   // creatures and food touching the box go too (and all of their body)
    for (const c of [...this.creatures]) if (this.touches(CREATURE_TYPES[c.type], c.scale, c.x, c.y, x0, y0, x1, y1)) { this.removeCreature(c); removed++; }
    for (const f of [...this.foods]) if (this.touches(FOOD_TYPES[f.type], 1, f.x, f.y, x0, y0, x1, y1)) { this.removeFood(f); removed++; }
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
      const i = y * w0 + x;
      if (this.grid[i] !== EMPTY) removed++;
      this.grid[i] = EMPTY; this.colors[i] = 0;
      this.drains.delete(i); this.emitters.delete(i); this.conveyors.delete(i);
    }
    this.grains = this.grains.filter(g => { const gx = trunc(g.x), gy = trunc(g.y); return !(gx >= x0 && gx <= x1 && gy >= y0 && gy <= y1); });

    return removed;
  }

  /** Stamp a copied region with its top-left at (ox, oy). Existing objects are never overwritten. */
  paste(clip, ox, oy) {
    const w = this.w, h = this.h, placed = new Set();
    for (const [dx, dy, kind, color, prop] of clip.cells) {
      const x = ox + dx, y = oy + dy;
      if (x < 0 || x >= w || y < 0 || y >= h) continue;
      const i = y * w + x;
      if (isObj(this.grid[i]) || isBody(this.grid[i])) continue;
      this.grid[i] = kind; this.colors[i] = color;
      placed.add(i);
      if (kind === DRAIN) this.drains.add(i);
      else if (kind === EMITTER) this.emitters.set(i, prop);
      else if (kind === CONVEYOR) this.conveyors.set(i, prop);
    }
    if (placed.size) {
      this.grains = this.grains.filter(g => !placed.has(trunc(g.y) * w + trunc(g.x)));
      let minX = w, maxX = 0, maxY = 0;
      for (const i of placed) { const x = i % w, y = (i - x) / w; if (x < minX) minX = x; if (x > maxX) maxX = x; if (y > maxY) maxY = y; }
      this.wakeRegion(minX, maxX, maxY);                 // pasted sand settles, anything left floating falls
    }
    return placed;
  }

  touchesDrain(x, y) {
    const w = this.w, h = this.h, g = this.grid;
    for (const [nx, ny] of [[x, y + 1], [x - 1, y + 1], [x + 1, y + 1], [x - 1, y], [x + 1, y], [x, y - 1]]) {
      if (nx >= 0 && nx < w && ny >= 0 && ny < h && g[ny * w + nx] === DRAIN) return true;
    }
    return false;
  }

  wakeAll() { this.wakeRegion(0, this.w - 1, this.h - 1); }

  /** Turn settled sand and water in columns x0..x1, from row yMax up, back into live grains. */
  wakeRegion(x0, x1, yMax) {
    const w = this.w;
    x0 = Math.max(x0, 0); x1 = Math.min(x1, w - 1); yMax = Math.min(yMax, this.h - 1);
    for (let y = yMax; y >= 0; y--) {                    // bottom row first, so piles re-settle in order
      for (let x = x0; x <= x1; x++) {
        const i = y * w + x, k = this.grid[i];
        if (k === STATIC || k === STILL_WATER) {
          const g = new Grain(x + 0.5, y + 0.5, 0, 0, this.colors[i] || DEFAULT_COLOR, k === STILL_WATER ? WATER : SAND);
          g.status = STACKING;
          this.grid[i] = STACKING;
          this.grains.push(g);
        }
      }
    }
  }

  /** All connected cells of the object at (x, y), i.e. the one thing you touched. */
  solidObject(x, y) {
    const w = this.w, h = this.h;
    if (x < 0 || x >= w || y < 0 || y >= h || !isObj(this.grid[y * w + x])) return new Set();
    const kind = this.grid[y * w + x];
    const found = new Set([y * w + x]), todo = [[x, y]];
    while (todo.length) {
      const [cx, cy] = todo.pop();
      for (const [nx, ny] of [[cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]]) {
        if (nx >= 0 && nx < w && ny >= 0 && ny < h) {
          const j = ny * w + nx;
          if (!found.has(j) && this.grid[j] === kind) { found.add(j); todo.push([nx, ny]); }
        }
      }
    }
    return found;
  }

  /** Slide an object by (dx, dy), ploughing through sand. Returns the new cells, or null if blocked. */
  moveSolid(cells, dx, dy) {
    const w = this.w, h = this.h, grid = this.grid, moved = new Set();

    }
    const kind = grid[cells.values().next().value];      // shape, trash, emitter or belt: it stays that kind
    const shift0 = dy * w + dx;                          // painted scenery keeps its colours when it is moved
    const keepColors = kind === SOLID ? new Map([...cells].map(i => [i + shift0, this.colors[i]])) : null;
    for (const i of cells) { grid[i] = EMPTY; this.colors[i] = 0; }   // 1. lift the object out
    let minX = w, maxX = 0, maxY = 0;                    // 2. wake the sand around both spots
    for (const set of [cells, moved]) for (const i of set) {
      const x = i % w, y = Math.floor(i / w);
      if (x < minX) minX = x;
      if (x > maxX) maxX = x;
      if (y > maxY) maxY = y;
    }
    this.wakeRegion(minX - 3, maxX + 3, maxY + 1);
    for (const j of moved) { grid[j] = kind; this.colors[j] = keepColors ? keepColors.get(j) || 0 : 0; }   // 3. set it down in the new spot
    const shift = dy * w + dx;
    if (kind === DRAIN) {                                // 4. carry along what the object remembers
      for (const i of cells) this.drains.delete(i);
      for (const j of moved) this.drains.add(j);
    }
    for (const props of [this.emitters, this.conveyors]) {
      const carried = [];
      for (const i of cells) if (props.has(i)) { carried.push([i + shift, props.get(i)]); props.delete(i); }
      for (const [j, v] of carried) props.set(j, v);
    }
    const keep = [];                                     // 5. shove any grain now inside it upward
    for (const g of this.grains) {
      const gx = trunc(g.x); let gy = trunc(g.y);
      if (moved.has(gy * w + gx)) {
        while (gy >= 0 && this.occupied(gx, gy)) gy--;
        if (gy < 0) continue;                            // no room above at all: the grain is lost
        g.y = gy + 0.5; g.vy = 0; g.status = STACKING;
        grid[gy * w + gx] = STACKING;
      }
      keep.push(g);
    }
    this.grains = keep;
    return moved;
  }

  clearSand() {
    this.grains = [];
    for (let i = 0; i < this.grid.length; i++) {
      if (!isObj(this.grid[i]) && !isBody(this.grid[i])) { this.grid[i] = EMPTY; this.colors[i] = 0; }
    }
  }

  /** Turn the whole world upside down. The caller then wakes the sand so it falls toward the new floor. */
  flip() {
    const w = this.w, h = this.h;
    for (const c of this.creatures) this.clearBody(c);   // creatures and food stay upright: they are put back, then fall to the new floor
    for (const f of this.foods) this.unmark(FOOD_TYPES[f.type], 1, f.x, f.y, FOOD);
    const grid = new Uint8Array(w * h), colors = new Uint32Array(w * h);
    for (let y = 0; y < h; y++) {
      grid.set(this.grid.subarray(y * w, (y + 1) * w), (h - 1 - y) * w);
      colors.set(this.colors.subarray(y * w, (y + 1) * w), (h - 1 - y) * w);
    }
    this.grid = grid; this.colors = colors;
    const mirror = i => (h - 1 - Math.floor(i / w)) * w + (i % w);
    this.drains = new Set([...this.drains].map(mirror));
    this.emitters = new Map([...this.emitters].map(([i, v]) => [mirror(i), v]));
    this.conveyors = new Map([...this.conveyors].map(([i, v]) => [mirror(i), v]));
    for (const g of this.grains) {
      const row = trunc(g.y), frac = g.y - row;
      g.y = Math.min(h - 1 - row + (frac ? 1 - frac : 0.5), h - 0.001);
      g.vy = 0;
    }

  }

  // ---------- painted scenery: solid cells that keep their own colour ----------
  addDecor(pixels) {                                     // pixels: [x, y, packed colour]; sand piles on it like any solid
    const w = this.w, colorAt = new Map();
    for (const [x, y, c] of pixels) if (x >= 0 && x < w && y >= 0 && y < this.h) colorAt.set(y * w + x, c);
    const placed = this.addSolid(pixels.map(p => [p[0], p[1]]), SOLID);
    for (const i of placed) this.colors[i] = colorAt.get(i);
    return placed;
  }

  // ---------- creatures: little pixel animals that live on the sand ----------
  bodyFree(def, scale, x, y) {                           // could a body of this shape sit with its top-left at (x, y)?
    const g = geomOf(def, scale), w = this.w, h = this.h;
    for (const [dx, dy] of g.mask) {
      const cx = x + dx, cy = y + dy;
      if (cx < 0 || cx >= w || cy < 0 || cy >= h) return false;
      const k = this.grid[cy * w + cx];

    }
    return true;
  }
  mark(def, scale, x, y, kind) { for (const [dx, dy] of geomOf(def, scale).mask) this.grid[(y + dy) * this.w + x + dx] = kind; }
  unmark(def, scale, x, y, kind) {
    for (const [dx, dy] of geomOf(def, scale).mask) { const i = (y + dy) * this.w + x + dx; if (this.grid[i] === kind) this.grid[i] = EMPTY; }
  }
  setBody(c) { this.mark(CREATURE_TYPES[c.type], c.scale, c.x, c.y, CREATURE); }   // mark its cells, so falling sand lands on it
  clearBody(c) { this.unmark(CREATURE_TYPES[c.type], c.scale, c.x, c.y, CREATURE); }
  touches(def, scale, bx, by, x0, y0, x1, y1) {          // does a body at (bx, by) overlap this rectangle?
    return geomOf(def, scale).mask.some(([dx, dy]) => { const cx = bx + dx, cy = by + dy; return cx >= x0 && cx <= x1 && cy >= y0 && cy <= y1; });
  }
  newCreature(type, x, y, scale, tint, dir) {
    return { type, x, y, scale, tint, dir: dir || (Math.random() < 0.5 ? -1 : 1), mode: "rest", timer: 10 + Math.floor(Math.random() * 30),
      vy: 0, bury: 0, frame: 0, shake: 0, age: 0, prog: 0, target: null, seekWait: 0, seekTicks: 0, hearts: 0, climb: 0, detour: 0,
      wet: 0, panic: 0, swim: false, submerged: false, onWater: false, thirst: 400 + Math.floor(Math.random() * 1200), drinking: 0, waterX: null, waterTicks: 0 };
  }
  addCreature(type, cx, cy, scale = 1, tint = null) {
    if (this.creatures.length >= MAX_CREATURES) return null;
    const def = CREATURE_TYPES[type], g = geomOf(def, scale);
    const x = Math.min(Math.max(cx - (g.w >> 1), 0), this.w - g.w);
    let y = Math.min(Math.max(cy - (g.h >> 1), 0), this.h - g.h);
    while (y > 0 && !this.bodyFree(def, scale, x, y)) y--;   // dropped into something: lift it out
    if (!this.bodyFree(def, scale, x, y)) return null;
    const c = this.newCreature(type, x, y, scale, tint);
    this.creatures.push(c);
    this.setBody(c);
    return c;
  }
  restoreCreature(rec) {                                 // put a saved creature back where it was
    const def = CREATURE_TYPES[rec.t];
    if (!def) return;
    const scale = Math.min(Math.max(rec.s || 1, 1), MAX_SCALE);
    if (!this.bodyFree(def, scale, rec.x, rec.y)) return;
    const c = this.newCreature(rec.t, rec.x, rec.y, scale, rec.c || null, rec.d || 1);
    this.creatures.push(c);
    this.setBody(c);
  }
  creatureAt(x, y) {                                     // the creature whose body covers this cell, if any
    if (x < 0 || y < 0 || x >= this.w || y >= this.h || this.grid[y * this.w + x] !== CREATURE) return null;
    return this.creatures.find(c => geomOf(CREATURE_TYPES[c.type], c.scale).mask.some(([dx, dy]) => c.x + dx === x && c.y + dy === y)) || null;
  }
  resizeCreature(c, ns) {                                // change its size, keeping its feet where they are
    const def = CREATURE_TYPES[c.type], old = geomOf(def, c.scale), nu = geomOf(def, ns);
    this.clearBody(c);
    const nx = Math.min(Math.max(c.x - ((nu.w - old.w) >> 1), 0), this.w - nu.w), ny = c.y + old.h - nu.h;
    let ok = false;
    for (let lift = 0; lift <= 12 && !ok; lift++) {      // cramped? lift it up a little to fit
      if (ny - lift >= 0 && this.bodyFree(def, ns, nx, ny - lift)) { c.scale = ns; c.x = nx; c.y = ny - lift; ok = true; }
    }
    this.setBody(c);
    return ok;
  }
  restyleCreature(c, scale, tint) { c.tint = tint; return scale === c.scale || this.resizeCreature(c, scale); }
  growCreature(c) { return c.scale < MAX_SCALE && this.resizeCreature(c, c.scale + 1); }
  removeCreature(c) { this.clearBody(c); this.creatures = this.creatures.filter(o => o !== c); }

  addFood(type, cx, cy) {
    if (this.foods.length >= MAX_FOODS) return null;
    const def = FOOD_TYPES[type], g = geomOf(def, 1);
    const x = Math.min(Math.max(cx - (g.w >> 1), 0), this.w - g.w);
    let y = Math.min(Math.max(cy - (g.h >> 1), 0), this.h - g.h);
    while (y > 0 && !this.bodyFree(def, 1, x, y)) y--;
    if (!this.bodyFree(def, 1, x, y)) return null;
    const f = { type, x, y };
    this.foods.push(f);
    this.mark(def, 1, x, y, FOOD);
    return f;
  }
  restoreFood(rec) {
    const def = FOOD_TYPES[rec.t];
    if (!def || !this.bodyFree(def, 1, rec.x, rec.y)) return;
    this.foods.push({ type: rec.t, x: rec.x, y: rec.y });
    this.mark(def, 1, rec.x, rec.y, FOOD);
  }
  removeFood(f) { this.unmark(FOOD_TYPES[f.type], 1, f.x, f.y, FOOD); this.foods = this.foods.filter(o => o !== f); }
  removeCreaturesIn(cells) {                             // cells: [x, y] pairs, such as what the eraser covers; creatures and food both go
    const w = this.w, covered = new Set();
    for (const [x, y] of cells) if (x >= 0 && x < w && y >= 0 && y < this.h) covered.add(y * w + x);
    const hit = (def, scale, bx, by) => geomOf(def, scale).mask.some(([dx, dy]) => covered.has((by + dy) * w + bx + dx));
    for (const c of [...this.creatures]) if (hit(CREATURE_TYPES[c.type], c.scale, c.x, c.y)) this.removeCreature(c);
    for (const f of [...this.foods]) if (hit(FOOD_TYPES[f.type], 1, f.x, f.y)) this.removeFood(f);
  }
  shedSand(c) {                                          // sand that was resting on its head has to fall once it moves away
    const g = geomOf(CREATURE_TYPES[c.type], c.scale);
    for (let dx = 0; dx < g.w; dx++) {
      if (g.tops[dx] < 0 || c.y + g.tops[dx] === 0) continue;
      const k = this.grid[(c.y + g.tops[dx] - 1) * this.w + c.x + dx];
      if (k === STATIC || k === STILL_WATER) { this.wakeRegion(c.x, c.x + g.w - 1, c.y + g.tops[dx] - 1); return; }
    }
  }
  stepFoods() {                                          // food falls until something is underneath
    for (const f of this.foods) {
      const def = FOOD_TYPES[f.type];
      this.unmark(def, 1, f.x, f.y, FOOD);
      if (this.bodyFree(def, 1, f.x, f.y + 1)) f.y++;
      this.mark(def, 1, f.x, f.y, FOOD);
    }
  }
  stepCreatures() { this.stepFoods(); for (const c of this.creatures) this.stepCreature(c); }
  advance(c, t) {                                        // how many steps it takes this tick (the speed setting scales this)
    c.prog += this.creatureSpeed;
    let n = 0;
    while (c.prog >= t.every && n < 3) { c.prog -= t.every; n++; }
    if (n === 3) c.prog = 0;
    return n;
  }
  stepCreature(c) {                                      // one tick of a creature's life (30 a second)
    const t = CREATURE_TYPES[c.type], g = geomOf(t, c.scale), w = this.w, speed = this.creatureSpeed;
    c.age++;
    if (c.shake > 0) c.shake--;
    if (c.hearts > 0) c.hearts--;
    if (c.seekWait > 0) c.seekWait--;
    this.clearBody(c);
    let fell = 0;
    if (c.mode !== "fly") {                              // 1. gravity: fall until something is underneath
      c.vy = Math.min(c.vy + 1, 3);
      for (let n = 0; n < c.vy; n++) {
        if (!this.bodyFree(t, c.scale, c.x, c.y + 1)) break;
        this.shedSand(c);
        c.y++; fell++;
      }
      if (!fell) c.vy = 0;
    }
    let loaded = false;                                  // 2. sand piled on its head for a while: shake it off
    for (let dx = 0; dx < g.w && !loaded; dx++) {
      if (g.tops[dx] < 0 || c.y + g.tops[dx] === 0) continue;
      if (this.grid[(c.y + g.tops[dx] - 1) * w + c.x + dx] === STATIC) loaded = true;   // sand only: water on top is handled below (it floats up)
    }
    c.bury = loaded ? c.bury + 1 : 0;
    if (c.bury > 14) { this.wakeRegion(c.x, c.x + g.w - 1, c.y - 1); c.bury = 0; c.shake = 10; }
    this.waterReactions(c, t, g);                        // 2b. how it feels about water
    if (c.submerged && c.age % 2 === 0) this.floatUp(c, g);   // 2c. buoyancy: it bobs up to the surface
    if (this.foods.length && this.tryEat(c, t, g)) { this.setBody(c); return; }   // 3. eat what it is touching
    if (!fell && speed > 0) {
      if (c.target && !this.foods.includes(c.target)) c.target = null;
      if (!c.target && c.seekWait <= 0 && c.age % 6 === 0) c.target = this.findFood(c, t, g);   // 4. look for food
      if (c.mode === "fly") this.birdFly(c, t, g);
      else if (c.target && t.fly) { c.mode = "fly"; c.climb = 0; c.timer = 60; this.birdFly(c, t, g); }
      else if (c.target) this.seek(c, t, g);
      else if (c.panic > 0) this.flee(c, t);             // soaked: run away from the water
      else if (this.thirstyStep(c, t, g)) { /* busy getting a drink */ }
      else {                                             // 5. wander: walk for a while, rest for a while
        if (c.mode === "seek") { c.mode = "rest"; c.timer = creatureRand(t.rest); }
        c.timer -= speed;
        if (c.timer <= 0) {

          else { c.mode = "walk"; c.timer = creatureRand(t.walk); if (Math.random() < 0.35) c.dir = -c.dir; }
        }
        if (t.fly && c.mode === "rest" && Math.random() < 0.004 * speed) {   // birds take off now and then
          c.mode = "fly"; c.climb = 6 + Math.floor(Math.random() * 14); c.timer = creatureRand([60, 160]); c.dir = Math.random() < 0.5 ? -1 : 1;
        } else if (c.mode === "walk") {

        }

    }
    this.setBody(c);
  }
  walkOne(c, t, dir) {                                   // one step sideways, climbing a ledge if it can; false if blocked
    if (t.water === "hate" && !c.onWater && this.waterUnder(t, c.scale, c.x + dir, c.y)) return false;   // it won't step into a pool
    const lift = t.step * c.scale;
    for (let up = 0; up <= lift; up++) {
      if (this.bodyFree(t, c.scale, c.x + dir, c.y - up)) { this.shedSand(c); c.x += dir; c.y -= up; c.frame ^= 1; return true; }
    }

  }
  peck(c, t, dir) {

    if (fx < 0 || fx >= w) return false;
    let eaten = 0, lowest = -1;
    for (let dy = g.h - 1; dy >= 0 && eaten < 3 * c.scale; dy--) {
      const y = c.y + dy, i = y * w + fx;
      if (this.grid[i] === STATIC) { this.grid[i] = EMPTY; this.colors[i] = 0; eaten++; if (lowest < 0) lowest = y; }
    }
    if (eaten) this.wakeRegion(fx, fx, lowest);          // whatever was above it falls into the gap
    return eaten > 0;
  }
  findFood(c, t, g) {                                    // the nearest piece of food it can see (and might reach)
    let best = null, bestD = Infinity;
    const cx = c.x + (g.w >> 1), cy = c.y + g.h - 1;     // measured from its feet
    for (const f of this.foods) {
      const fg = geomOf(FOOD_TYPES[f.type], 1);
      const dx = f.x + (fg.w >> 1) - cx, dy = f.y + fg.h - 1 - cy;   // dy < 0: the food is higher than its feet
      if (Math.abs(dx) > VISION) continue;
      if (t.fly ? Math.abs(dy) > VISION : (dy < -t.step * c.scale * 2 || dy > 60)) continue;   // walkers ignore food on a high shelf
      const d = Math.abs(dx) + Math.abs(dy) * (t.fly ? 1 : 2);
      if (d < bestD) { bestD = d; best = f; }
    }
    if (best) c.seekTicks = 0;
    return best;
  }
  seek(c, t, g) {                                        // walk toward the food it spotted
    c.mode = "seek";
    const f = c.target, fg = geomOf(FOOD_TYPES[f.type], 1);
    const tx = f.x + (fg.w >> 1), cx = c.x + (g.w >> 1);
    if (Math.abs(tx - cx) > 1) c.dir = tx < cx ? -1 : 1;
    let n = this.advance(c, t);
    c.seekTicks++;
    while (n-- > 0) {
      if (Math.abs(tx - cx) <= 1) break;                 // right under it: nothing more to do
      if (!this.walkOne(c, t, c.dir)) { c.target = null; c.seekWait = 90; c.mode = "rest"; c.timer = 20; return; }   // blocked: give up for a while
    }
    if (c.seekTicks > 400) { c.target = null; c.seekWait = 300; c.mode = "rest"; c.timer = 20; }   // can't get there
  }
  birdFly(c, t, g) {                                     // birds fly: up, around, to food, and back down
    c.mode = "fly";
    c.timer -= this.creatureSpeed;
    let steps = this.advance(c, t);
    while (steps-- > 0) {
      let dx = c.dir, dy = 0;
      const f = c.target;
      if (f) {                                           // straight for the food
        const fg = geomOf(FOOD_TYPES[f.type], 1);
        const tx = f.x + (fg.w >> 1), ty = f.y + (fg.h >> 1), cx = c.x + (g.w >> 1), cy = c.y + (g.h >> 1);
        const hover = ty - 8 * c.scale;                  // fly in above the food, then drop onto it (so ledges don't trap it)
        dx = Math.sign(tx - cx);
        dy = Math.abs(tx - cx) > 2 ? (cy > hover ? -1 : cy < hover - 3 ? 1 : 0) : Math.sign(ty - cy);
        if (c.detour) { dx = Math.sign(c.detour); dy = -1; c.detour -= Math.sign(c.detour); }   // boxed in: sidestep along the wall, climbing when it can
        if (dx) c.dir = dx;
        c.seekTicks++;
        if (c.seekTicks > 400) { c.target = null; c.seekWait = 120; }
      } else if (c.climb > 0) { dy = -1; c.climb--; }
      else if (c.timer > 0) { dy = Math.random() < 0.35 ? (Math.random() < 0.5 ? -1 : 1) : 0; }
      else dy = 1;                                       // time to come down
      let moved = false;
      for (const [mx, my] of [[dx, dy], [dx, 0], [0, dy]]) {
        if ((mx || my) && this.bodyFree(t, c.scale, c.x + mx, c.y + my)) { c.x += mx; c.y += my; moved = true; c.frame ^= 1; break; }
      }
      if (!moved && f && !c.detour) c.detour = (Math.random() < 0.5 ? -1 : 1) * 14;
      if (!moved && !f && dy <= 0) c.dir = -c.dir;       // bumped into something: turn round
      if (!f && c.climb <= 0 && c.timer <= 0 && !this.bodyFree(t, c.scale, c.x, c.y + 1)) {   // landed
        c.mode = "rest"; c.timer = creatureRand(t.rest); c.vy = 0;
        return;
      }
    }
  }
  tryEat(c, t, g) {                                      // food touching (or right next to) its body gets eaten
    for (const f of this.foods) {
      const fg = geomOf(FOOD_TYPES[f.type], 1);
      if (f.x <= c.x + g.w && f.x + fg.w - 1 >= c.x - 1 && f.y <= c.y + g.h && f.y + fg.h - 1 >= c.y - 1) {
        const liked = t.likes.includes(f.type);
        this.removeFood(f);
        this.wakeRegion(f.x, f.x + fg.w - 1, f.y - 1);   // anything that was piled on the food falls
        c.target = null; c.seekWait = 0; c.mode = "rest"; c.timer = 20; c.detour = 0;
        if (liked) { c.hearts = 16; this.growCreature(c); }   // food it likes makes it grow; the rest it just eats
        return true;
      }
    }
    return false;
  }
  // ---------- water: some creatures love it, some hate it, and all of them get thirsty ----------
  waterUnder(def, scale, x, y) {                         // is there water directly under a body standing with its top-left at (x, y)?
    const g = geomOf(def, scale), row = y + g.h;
    if (row >= this.h) return false;
    for (let dx = 0; dx < g.w; dx++) {
      const cx = x + dx;
      if (cx >= 0 && cx < this.w && this.grid[row * this.w + cx] === STILL_WATER) return true;
    }
    return false;
  }
  waterCellsNear(c, g) {                                 // water cells touching the lower part of its body or just under its feet
    const w = this.w, out = [];
    const y0 = Math.max(c.y + g.h - 3, 0), y1 = Math.min(c.y + g.h + 1, this.h - 1);
    for (let y = y0; y <= y1; y++) for (let x = Math.max(c.x - 1, 0); x <= Math.min(c.x + g.w, w - 1); x++) {
      if (this.grid[y * w + x] === STILL_WATER) out.push(y * w + x);
    }
    return out;
  }
  waterReactions(c, t, g) {                              // splashed, soaked or swimming: each kind of creature has its own opinion
    const w = this.w;
    let above = false, beside = false;
    for (let dx = 0; dx < g.w && !above; dx++) {         // water resting on its head
      if (g.tops[dx] < 0) continue;
      const y = c.y + g.tops[dx] - 1;
      if (y >= 1 && (this.grid[y * w + c.x + dx] === STILL_WATER || this.grid[(y - 1) * w + c.x + dx] === STILL_WATER)) above = true;
    }
    let sideDir = 0;
    for (let dy = g.h >> 1; dy < g.h && !sideDir; dy++) {   // water up against its lower body
      const y = c.y + dy;
      if (c.x - 1 >= 0 && this.grid[y * w + c.x - 1] === STILL_WATER) sideDir = 1;      // water on the left: head right
      else if (c.x + g.w < w && this.grid[y * w + c.x + g.w] === STILL_WATER) sideDir = -1;
    }
    beside = sideDir !== 0;
    c.submerged = above;                                 // water over its head: it will float up
    c.onWater = this.waterUnder(t, c.scale, c.x, c.y);
    c.swim = c.onWater && t.water === "love";
    if (t.water === "hate") {
      if ((above || beside) && c.wet === 0) {            // startled: shake it off and run
        c.wet = 1; c.shake = 12; c.panic = 40; c.mode = "walk";
        c.dir = sideDir || (Math.random() < 0.5 ? -1 : 1);
      } else if (!(above || beside)) c.wet = 0;
      if (c.onWater && c.panic <= 0 && c.age % 90 === 0) { c.panic = 30; c.dir = Math.random() < 0.5 ? -1 : 1; }   // standing in a pool: get out
    } else if (t.water === "love") {                     // splashing about makes it happy: hearts as soon as it gets wet, then every so often
      if (above || beside || c.onWater) { if (c.wet === 0 || c.age % 40 === 0) c.hearts = 10; c.wet = 1; } else c.wet = 0;
    }
  }
  floatUp(c, g) {                                        // swap places with the water above, so a submerged creature rises to the surface
    if (c.y <= 0) return;
    const w = this.w, ny = c.y - 1, oldCells = new Set(), newCells = [];
    for (const [dx, dy] of g.mask) { oldCells.add((c.y + dy) * w + c.x + dx); newCells.push((ny + dy) * w + c.x + dx); }
    const water = [];
    for (const i of newCells) {
      if (oldCells.has(i)) continue;
      const k = this.grid[i];
      if (k === STILL_WATER) water.push(i);
      else if (k !== EMPTY && k !== IN_AIR) return;      // something solid above: it stays put
    }
    const newSet = new Set(newCells), vacated = [...oldCells].filter(i => !newSet.has(i));
    water.forEach((wi, n) => { this.grid[vacated[n]] = STILL_WATER; this.colors[vacated[n]] = this.colors[wi]; this.colors[wi] = 0; });   // the water moves in underneath it
    c.y = ny;
  }
  flee(c, t) {                                           // run away (two steps a tick) until the panic wears off
    c.panic--;
    c.mode = "walk";
    for (let i = 0; i < 2; i++) if (!this.walkOne(c, t, c.dir)) { c.dir = -c.dir; break; }
  }
  findWater(c, t, g) {                                   // the x of the nearest water it can see at about its own level
    const w = this.w, cx = c.x + (g.w >> 1);
    let best = null, bestD = Infinity;
    for (let y = Math.max(c.y - 6, 0); y <= Math.min(c.y + g.h + 8, this.h - 1); y++) {
      for (let x = Math.max(c.x - VISION, 0); x <= Math.min(c.x + g.w + VISION, w - 1); x++) {
        if (this.grid[y * w + x] === STILL_WATER && Math.abs(x - cx) < bestD) { bestD = Math.abs(x - cx); best = x; }
      }
    }
    return best;
  }
  thirstyStep(c, t, g) {                                 // now and then: go to the water's edge and drink. true if it used this tick
    if (c.drinking > 0) {
      c.drinking--;
      if (c.drinking % 6 === 0) this.sip(c, g);
      if (c.drinking === 0) { c.hearts = 10; c.thirst = creatureRand([900, 2400]); c.mode = "rest"; c.timer = 30; }
      return true;
    }
    c.thirst -= this.creatureSpeed;
    if (c.thirst > 0 && c.waterX === null) return false;
    if (c.waterX === null) {                             // thirsty: look around
      c.waterX = this.findWater(c, t, g);
      if (c.waterX === null) { c.thirst = 900; return false; }
      c.waterTicks = 0;
    }
    if (this.waterCellsNear(c, g).length) { c.drinking = 24; c.waterX = null; c.mode = "rest"; return true; }
    c.mode = "seek"; c.waterTicks++;
    c.dir = c.waterX < c.x + (g.w >> 1) ? -1 : 1;
    let n = this.advance(c, t);
    while (n-- > 0) {
      if (!this.walkOne(c, t, c.dir)) { c.waterX = null; c.thirst = 600; c.mode = "rest"; c.timer = 20; return true; }   // can't get there
    }
    if (c.waterTicks > 500) { c.waterX = null; c.thirst = 900; c.mode = "rest"; c.timer = 20; }

  }
  sip(c, g) {                                            // one mouthful: a water cell at the surface disappears
    const cells = this.waterCellsNear(c, g);
    if (!cells.length) return;
    const i = cells.reduce((a, b) => (b < a ? b : a));   // the highest one (smallest row)
    const x = i % this.w, y = (i - x) / this.w;

    this.wakeRegion(x - 1, x + 1, y);                    // the water around it flows in to fill the gap
  }
  repositionCreaturesAfterFlip() {
    for (const c of [...this.creatures]) {
      const t = CREATURE_TYPES[c.type], g = geomOf(t, c.scale);

      while (c.y > 0 && !this.bodyFree(t, c.scale, c.x, c.y)) c.y--;
      if (this.bodyFree(t, c.scale, c.x, c.y)) this.setBody(c); else this.creatures = this.creatures.filter(o => o !== c);
    }

      f.y = this.h - f.y - g.h;
      while (f.y > 0 && !this.bodyFree(def, 1, f.x, f.y)) f.y--;
      if (this.bodyFree(def, 1, f.x, f.y)) this.mark(def, 1, f.x, f.y, FOOD); else this.foods = this.foods.filter(o => o !== f);
    }
  }

  // ---------- the physics ----------
  status(g) {
    if (g.kind === WATER) return this.waterStatus(g);
    const w = this.w, grid = this.grid, x = trunc(g.x), y = trunc(g.y);
    if (y >= this.h - 1) return STATIC;
    const below = grid[(y + 1) * w + x];
    if (below === EMPTY || below === IN_AIR) return IN_AIR;
    g.vy = 0;
    if (below === CONVEYOR || below === STILL_WATER) return STACKING;   // riding a belt / about to sink
    const row = (y + 1) * w;
    if (x > 0 && x < w - 1) {
      if (FIRM[below] && FIRM[grid[row + x - 1]] && FIRM[grid[row + x + 1]]) return STATIC;
    } else if (x <= 0) {
      if (FIRM[below] && FIRM[grid[row + x + 1]]) return STATIC;
    } else if (FIRM[below] && FIRM[grid[row + x - 1]]) return STATIC;
    return STACKING;
  }

  /** Water only settles when it is boxed in: firm below, and nowhere to flow left or right. */
  waterStatus(g) {
    const w = this.w, grid = this.grid, x = trunc(g.x), y = trunc(g.y);
    const floor = y >= this.h - 1;
    if (!floor) { const b = grid[(y + 1) * w + x]; if (b === EMPTY || b === IN_AIR) return IN_AIR; }
    g.vy = 0;
    if (g.idle > WATER_PATIENCE) return STATIC;          // wandered long enough: settle where it is
    if (!floor) {
      const below = grid[(y + 1) * w + x];
      if (!FIRM[below] || below === CONVEYOR) return STACKING;   // resting on something that may still move
    }
    for (const nx of [x - 1, x + 1]) {
      if (nx >= 0 && nx < w) {
        if (!FIRM[grid[y * w + nx]]) return STACKING;    // empty, or a grain that may move away
        if (!floor && !FIRM[grid[(y + 1) * w + nx]]) return STACKING;
      }
    }
    return STATIC;
  }

  /** Look down both neighbouring columns, go to whichever lets it fall further. */
  slide(g) {
    const w = this.w, h = this.h, x = trunc(g.x), y = trunc(g.y);
    if (y >= h - 1) return null;
    const landing = {};
    for (const dx of [-1, 1]) {
      const nx = x + dx;
      if (nx < 0 || nx > w - 1 || this.occupied(nx, y + 1)) landing[dx] = y;   // blocked: stays at this height
      else {
        let r = y + 1;
        while (r <= h - 1 && !this.occupied(nx, r)) r++;
        landing[dx] = r - 1;                             // row just above the first obstacle
      }
    }
    const L = landing[-1], R = landing[1];
    if (L === y && R === y) return null;
    if (L > R || (L === R && g.vx < 0)) return [-1, L];
    return [1, R];

  /** Water with nowhere to fall spreads out: walk up to 4 cells left or right. */
  flowSideways(g) {
    const w = this.w, h = this.h, x = trunc(g.x), y = trunc(g.y);
    const first = g.vx >= 0 ? 1 : -1;                    // keep going the way it was going
    for (const d of [first, -first]) {

      for (let n = 0; n < 4; n++) {
        if (!(nx >= 0 && nx < w) || this.occupied(nx, y)) break;
        best = nx;
        if (y + 1 < h && !this.occupied(nx, y + 1)) break;   // found a drop: stop here and fall next step
        nx += d;
      }
      if (best !== null) {
        this.lift(g);
        g.x = best + 0.5; g.vx = d * 0.5;
        return true;
      }
    }
    return false;
  }

  /** Sand resting on settled water swaps places with it (sand is heavier). */
  sink(g) {
    const w = this.w, x = trunc(g.x), y = trunc(g.y);
    this.lift(g);
    const water = new Grain(x + 0.5, y + 0.5, g.vx, 0, this.colors[(y + 1) * w + x], WATER);
    water.status = STACKING;
    this.grid[y * w + x] = STACKING;
    this.grid[(y + 1) * w + x] = EMPTY;
    this.colors[(y + 1) * w + x] = 0;
    this.grains.push(water);                             // (gets its turn later this step)
    g.y += 1;

  step() {
    const w = this.w, h = this.h, grid = this.grid, alive = [];
    // (grains added during the loop, like the water from sink(), are picked up by index)
    for (let n = 0; n < this.grains.length; n++) {
      const g = this.grains[n];
      if (g.status === IN_AIR) {
        const xi = trunc(g.x), yi = trunc(g.y);

        // ---- sideways move (bounce off outer walls, shapes and piles) ----
        let nx = g.x + g.vx;
        if (nx < 0) { nx = -nx; g.vx = -g.vx; }
        else if (nx > w - 1) { nx = 2 * (w - 1) - nx; g.vx = -g.vx; }
        nx = Math.min(Math.max(nx, 0), w - 1);

        const rx = this.sweepX(yi, xi, tx);
        if (rx !== tx) { nx = rx + 0.5; g.vx *= -Math.max(0.3, this.bounce); }
        g.x = nx;

        // ---- vertical move: stop at the first solid thing in the way ----
        const ny = g.y + g.vy;
        const ty = Math.min(Math.max(trunc(ny), 0), h - 1);
        const ry = this.sweepY(trunc(g.x), yi, ty);
        if (ry !== ty || ny >= h - 1) {                  // blocked (by something, or by the floor)
          g.y = ry + 0.5;
          if (g.vy < 0) g.vy = 0;
          else if (this.bounce > 0 && g.vy > 2.0) {      // hit hard enough to bounce: splash up
            g.vy = -g.vy * this.bounce;
            g.vx += (Math.random() * 2 - 1) * -g.vy * 0.6;
            bounced = true;
          }
        } else g.y = Math.min(Math.max(ny, 0), h - 0.001);

        // another grain may have claimed this exact cell earlier this step: hop up
        const fx = trunc(g.x);
        let fy = trunc(g.y);
        while (fy > 0 && this.occupied(fx, fy)) fy--;
        if (fy !== trunc(g.y)) g.y = fy + 0.5;

        g.vy += this.gravity;
        g.vx = g.vx * this.drag + this.wind;
        g.idle = 0;
        g.status = bounced ? IN_AIR : this.status(g);

      } else if (g.status === STACKING) {
        const x = trunc(g.x), y = trunc(g.y);

          this.sink(g);
        } else {

          if (move) {
            this.lift(g);

      }
      if (g.status === STATIC) {
        grid[i] = g.kind === WATER ? STILL_WATER : STATIC;
        this.colors[i] = g.color;
      } else {
        this.put(xi, yi, g.status);
        alive.push(g);
      }
    }
    this.grains = alive;
  }
}

// ---------- shape outlines (offsets from the cursor) ----------
const shapeCache = new Map();
function shapeCells(name, r) {
  const key = name + r;
  if (shapeCache.has(key)) return shapeCache.get(key);
  const cells = [];
  if (name === "sphere") {                               // filled circle
    for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) if (dx * dx + dy * dy <= r * r + 1) cells.push([dx, dy]);
  } else if (name === "cone") {                          // triangle, apex up, widens going down
    for (let dy = -r; dy <= r; dy++) { const half = Math.floor((dy + r) / 2); for (let dx = -half; dx <= half; dx++) cells.push([dx, dy]); }
  } else if (name === "box") {
    for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) cells.push([dx, dy]);
  } else if (name === "emitter") {                       // a spout: wide and 3 cells thick
    for (let dy = -1; dy <= 1; dy++) for (let dx = -r; dx <= r; dx++) cells.push([dx, dy]);
  } else if (name === "trash") {                         // a wide bar, 4 cells thick
    for (let dy = -2; dy <= 1; dy++) for (let dx = -r; dx <= r; dx++) cells.push([dx, dy]);
  } else if (name === "bowl") {                          // lower half of a hollow circle
    for (let dy = 0; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
      const d2 = dx * dx + dy * dy;
      if ((r - 2) * (r - 2) <= d2 && d2 <= r * r) cells.push([dx, dy - Math.floor(r / 2)]);
    }
  }
  shapeCache.set(key, cells);
  return cells;
}

function beltCells(x0, x1, y) {                          // a conveyor belt: a horizontal bar, 3 cells thick
  const out = [];
  for (let x = Math.min(x0, x1); x <= Math.max(x0, x1); x++) for (let dy = -1; dy <= 1; dy++) out.push([x, y + dy]);
  return out;
}

function lineCells(x0, y0, x1, y1) {                     // Bresenham line, 2 cells thick so sand can't squeeze through
  const seen = new Map();
  const dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx - dy, x = x0, y = y0;
  for (;;) {
    for (const ox of [0, 1]) for (const oy of [0, 1]) seen.set((x + ox) + "," + (y + oy), [x + ox, y + oy]);
    if (x === x1 && y === y1) break;
    const e2 = 2 * err;
    if (e2 > -dy) { err -= dy; x += sx; }
    if (e2 < dx) { err += dx; y += sy; }
  }
  return [...seen.values()];
}

function updateLabel() {

    const fans = Object.keys(CREATURE_TYPES).filter(n => CREATURE_TYPES[n].likes.includes(tool));
    s += ` · tap to drop · ${fans.join(", ")} love it`;

  if (DECOR_TYPES[tool]) s += ` · ${decorScale()}× · tap to place`;

      const [ex, ey] = rampEnd(dragStart, cur.x, cur.y);
      const deg = Math.atan2(Math.abs(ey - dragStart[1]), Math.abs(ex - dragStart[0])) * 180 / Math.PI;
      s += ` · ${deg.toFixed(0)}° · ${Math.round(Math.hypot(ex - dragStart[0], ey - dragStart[1]))} cells`;

// ---- screenshot: just the sandbox (background, drawing and sand), no cursor or selection marks ----

// ---- mirror / kaleidoscope: the screen is cut into n strips, each a reflection of its neighbour ----
function mirrorCopies(x) {

  return Array.from({ length: n }, (_, k) => {

    return k % 2 === 0 ? e[k] + l : e[k + 1] - 1 - l;

    localStorage.setItem(SAVE_KEY, JSON.stringify({

      emitters: [...sand.emitters], conveyors: [...sand.conveyors],

      foods: sand.foods.map(f => ({ t: f.type, x: f.x, y: f.y })),

// ---- pointer input ----
const cur = { x: 0, y: 0, over: false };
function toCell(e) {

}

// ---- ramp snapping: Shift = 5° steps, Ctrl = grid; the Snap button does the same for touch screens ----

    let done = 0;
    for (const mx of mirroredXs(cx)) {
      const there = sand.creatureAt(mx, cy);
      if (there) { if (sand.restyleCreature(there, creatureScale, creatureTint)) done++; else toast("No room to grow there"); }
      else if (sand.addCreature(tool, mx, cy, creatureScale, creatureTint)) done++;
    }
    if (!done) toast(sand.creatures.length >= MAX_CREATURES ? "That's plenty of creatures" : "No room there");
    updateLabel();

  if (FOOD_TYPES[tool]) {                                // a piece of food that falls to the ground
    let done = 0;

  if (e.target.tagName === "INPUT" && e.target.type !== "range") return;
  const k = e.key.toLowerCase();
  if (e.ctrlKey || e.metaKey) {                          // Ctrl+C / Ctrl+V work too
    if (k === "c" && selection) { e.preventDefault(); copySelection(); }
    else if (k === "v" && clipboard) { e.preventDefault(); startPasting(); }
    else if (k === "z") { e.preventDefault(); undoStroke(); }
    return;
  }
  if (k === "escape") { cancelSelection(); closeMenus(); }
  else if (k === "c" && selection) copySelection();
  else if ((k === "delete" || k === "backspace") && selection) deleteSelection();
  else if (k === "v" && clipboard) startPasting();
  else if (Object.hasOwn(KEY_TOOLS, k)) selectTool(KEY_TOOLS[k]);
  else if (k === "r") clearSand();
  else if (k === "x") clearAll();
  else if (k === "w") setMaterial(1 - material);
  else if (k === "t") toggleFx("trails");
  else if (k === "p") toggleFx("sparkle");
  else if (k === "m") cycleMirror();
  else if (k === "f") flipWorld();
  else if (k === "h") hourglass();
  else if (k === "s") saveScene();
  else if (k === "l") loadScene();
});

// ---- per-step simulation + rainbow ----
let hueDrift = 0, beltPhase = 0, frameNo = 0, stepNo = 0;
function liveSand() {
  const base = hexToRgb(sandHex);
  if (ctl.hue === 0) return base;
  const [h, s, v] = toHsv(base);
  return hsvToRgb(h + hueDrift, Math.max(s, 0.5), Math.max(v, 0.5));
}
function simStep() {
  sand.gravity = ctl.gravity; sand.wind = ctl.wind; sand.bounce = ctl.bounce; sand.creatureSpeed = ctl.creatureSpeed;
  if (ctl.hue === 0) hueDrift = 0; else hueDrift = (hueDrift + ctl.hue / 600) % 1;
  const live = [liveSand(), THEME.water];                // indexed by SAND / WATER

  if (moving) {                                          // Move tool: drag the object toward the finger
    const tx = Math.min(Math.max(cur.x, 0), W - 1), ty = Math.min(Math.max(cur.y, 0), H - 1);
    const dx = Math.min(Math.max(tx - moveAnchor[0], -3), 3), dy = Math.min(Math.max(ty - moveAnchor[1], -3), 3);
    for (const [sx, sy] of [[dx, dy], [dx, 0], [0, dy]]) {   // blocked? try sliding along one axis
      const moved = (sx || sy) && sand.moveSolid(moving, sx, sy);
      if (moved) { moving = moved; moveAnchor = [moveAnchor[0] + sx, moveAnchor[1] + sy]; break; }
    }
  }
  if (holding && tool === "pour") {
    for (const mx of mirroredXs(cur.x)) sand.pour(mx, cur.y, ctl.rate, live[material], ctl.spread, material === WATER ? 0.06 : ctl.shade, material);
  } else if (holding && tool === "erase") {
    for (const mx of mirroredXs(cur.x)) {
      const cells = at(mx, cur.y, eraseShape, Math.max(2, ctl.size >> 1));
      sand.removeSolid(cells);
      sand.removeCreaturesIn(cells);                     // the eraser removes creatures too
    }
  }
  sand.runEmitters(ctl.flow, live, ctl.shade);
  sand.step();
  if (++stepNo % 4 === 0) sand.stepCreatures();          // creatures think 30 times a second
}

// ---- drawing ----
const PIXEL_COLORS = { g: pack(47, 143, 58), G: pack(134, 224, 122), k: pack(26, 26, 26), w: pack(244, 244, 244), p: pack(255, 143, 176),
  y: pack(255, 216, 74), o: pack(255, 140, 26), O: pack(196, 98, 12), n: pack(150, 100, 60), N: pack(98, 60, 32), t: pack(222, 190, 140),
  b: pack(74, 163, 255), r: pack(220, 50, 60), v: pack(130, 60, 170), s: pack(200, 210, 225) };
function creatureColor(c, ch) {
  const f = CREATURE_TYPES[c.type].body[ch];
  if (c.tint && f !== undefined) {                       // a custom colour replaces the body letters, keeping their light and dark
    return pack(Math.min(255, (c.tint[0] * f) | 0), Math.min(255, (c.tint[1] * f) | 0), Math.min(255, (c.tint[2] * f) | 0));
  }
  return PIXEL_COLORS[ch];
}
const HEART = [".r.r.", "rrrrr", ".rrr.", "..r.."];      // shown above a creature that just ate something it loves
function drawCreature(c) {
  const t = CREATURE_TYPES[c.type], k = c.scale, w = t.rows[0].length, h = t.rows.length;
  const rows = c.mode === "fly" && c.frame && t.flyRows ? t.flyRows : t.rows;   // wings up, wings down
  let bob = (c.mode === "walk" || c.mode === "seek") && c.frame && !t.fly ? -1 : 0;   // a little hop in time with its steps
  if (c.drinking > 0) bob = (c.age >> 1) & 1;            // dips its head to drink
  else if (c.swim) bob = (c.age >> 2) & 1 ? -1 : 0;      // bobs about in the water
  const shake = c.shake > 0 ? (c.shake & 1 ? 1 : -1) : 0;   // wiggles when it is shaking sand off
  for (let ry = 0; ry < h; ry++) for (let rx = 0; rx < w; rx++) {
    const ch = rows[ry][c.dir < 0 ? w - 1 - rx : rx];
    if (ch === ".") continue;
    const col = creatureColor(c, ch);
    for (let j = 0; j < k; j++) for (let i = 0; i < k; i++) {
      const x = c.x + rx * k + i + shake, y = c.y + ry * k + j + bob;
      if (x >= 0 && x < W && y >= 0 && y < H) buf[y * W + x] = col;
    }
  }
  if (c.hearts > 0) {
    const hx = c.x + ((w * k) >> 1) - 2, hy = c.y - 6 - (c.hearts > 8 ? 0 : 1);
    HEART.forEach((row, ry) => [...row].forEach((ch, rx) => {
      const x = hx + rx, y = hy + ry;
      if (ch !== "." && x >= 0 && x < W && y >= 0 && y < H) buf[y * W + x] = PIXEL_COLORS.p;
    }));
  }
}
function drawFood(f) {
  FOOD_TYPES[f.type].rows.forEach((row, ry) => [...row].forEach((ch, rx) => {
    const x = f.x + rx, y = f.y + ry;
    if (ch !== "." && x >= 0 && x < W && y >= 0 && y < H) buf[y * W + x] = PIXEL_COLORS[ch];
  }));
}

// ---- scenery: little Stardew-style pixel buildings and plants. They are solid, and sand piles on them. ----
const DECOR_COLORS = { a: pack(110, 190, 80), A: pack(58, 130, 60), T: pack(118, 78, 44), U: pack(84, 54, 30), f: pack(190, 140, 86), F: pack(140, 98, 58),
  R: pack(178, 64, 56), r: pack(130, 44, 42), W: pack(236, 214, 170), w: pack(206, 180, 134), D: pack(110, 70, 40), G: pack(150, 200, 230),
  K: pack(140, 140, 150), P: pack(36, 100, 70), p: pack(70, 150, 90) };
const DECOR_TYPES = {
  oak: { rows: ["...aaaaa...", "..aaaaaaa..", ".aaaAaaaaA.", ".aAaaaaAaa.", "aaaaAaaaaaa", "aAaaaaaAaaa", "aaaAaaaaaAa", ".aaaaAaaaa.", "..AAaaaaAA.",
    "....UUT....", "....TUT....", "....TUT....", "....TUT....", "...TTUTT..."] },
  pine: { rows: ["....P....", "...PpP...", "..PPpPP..", "...PpP...", "..PpPpP..", ".PPpPpPP.", "..PpPpP..", ".PpPpPpP.", "PPpPpPpPP", "....T....", "....T....", "...UTU..."] },
  bush: { rows: ["..aaa..", ".aaAaa.", "aaaaAaa", "aAaaaAa"] },
  fence: { rows: ["ff...ff...ff", "fF...fF...fF", "ffffffffffff", "fF...fF...fF", "ffffffffffff", "fF...fF...fF", "FF...FF...FF"] },
  house: { rows: ["........RRRR..KK....", ".......RRRRRR.KK....", "......RRRRRRRRKK....", ".....RRRRRRRRRR.....", "....RRRRRRRRRRRR....", "...RRRRRRRRRRRRRR...",
    "..RRRRRRRRRRRRRRRR..", ".RRRRRRRRRRRRRRRRRR.", "rrrrrrrrrrrrrrrrrrrr", ".WWWWWWWWWWWWWWWWWW.", ".WGGWWDDDDWWWWGGWWW.", ".WGGWWDDDDWWWWGGWWW.",
    ".WWWWWDDDDWWWWWWWWW.", ".wwwwwDDDDwwwwwwwww.", ".wwwwwDDKDwwwwwwwww.", "UUUUUUUUUUUUUUUUUUUU"] },
};
const decorScale = () => sceneryScale;
function decorPixels(type, cx, bottomY, scale) {         // [x, y, colour] for every pixel, standing on bottomY and centred on cx
  const rows = DECOR_TYPES[type].rows, w = rows[0].length, h = rows.length, out = [];
  const x0 = cx - ((w * scale) >> 1), y0 = bottomY - h * scale + 1;
  rows.forEach((row, ry) => [...row].forEach((ch, rx) => {
    if (ch === ".") return;
    for (let j = 0; j < scale; j++) for (let i = 0; i < scale; i++) out.push([x0 + rx * scale + i, y0 + ry * scale + j, DECOR_COLORS[ch]]);
  }));
  return out;
}
function objectColor(i, k) {
  if (k === EMITTER) {
    const e = sand.emitters.get(i) || [SAND, null], x = i % W;
    const base = e[0] === WATER ? THEME.water : e[1] || hsvToRgb((x * 0.025) % 1, 0.55, 0.95);
    return P(lerpRgb(base, THEME.shape, 0.3));
  }
  if (k === CONVEYOR) {
    const d = sand.conveyors.get(i) || 1, x = i % W;
    return (Math.floor((x - d * beltPhase) / 3) % 2 + 2) % 2 === 0 ? P(THEME.belt) : P(THEME.beltDark);
  }
  if (k === DRAIN) return P(THEME.trash);
  return sand.colors[i] || P(THEME.shape);               // scenery keeps its own colours; plain shapes are grey
}
const WHITE = pack(255, 255, 255), SEAM = P(THEME.accentDim);
function updateFx() {
  if (fx.trails) {
    for (let i = 0; i < trailA.length; i++) if (trailA[i]) trailA[i] = Math.max(0, trailA[i] - 4);
    for (const g of sand.grains) {                       // a soft glow, stretched back along the fall
      const x = trunc(g.x), y = trunc(g.y), streak = Math.min(Math.max(trunc(g.vy), 0), 12);
      const c = P(lerpRgb(unpackRgb(g.color), [255, 255, 255], 0.25));
      for (let s = 0; s <= streak; s++) {
        const yy = y - s;
        if (yy < 0) break;
        for (let dx = -1; dx <= 1; dx++) {
          const xx = x + dx;
          if (xx < 0 || xx >= W) continue;
          const i = yy * W + xx;
          trailC[i] = c; trailA[i] = Math.max(trailA[i], dx === 0 ? 120 : 60);
        }
      }
    }
  }
  if (fx.sparkle) {
    for (let i = 0; i < sparkA.length; i++) if (sparkA[i]) sparkA[i] = Math.max(0, sparkA[i] - 12);
    const wave = performance.now() / 500;
    for (let n = Math.floor(W * H / 290); n > 0; n--) {  // poke random cells; some of them twinkle
      const x = Math.floor(Math.random() * W), y = Math.floor(Math.random() * H), i = y * W + x, k = sand.grid[i];
      if (k === STATIC && Math.random() < 0.1) { sparkC[i] = blend(sand.colors[i], WHITE, 165); sparkA[i] = 255; }
      else if (k === STILL_WATER && Math.random() < 0.3 && Math.sin(wave + x * 0.09 + y * 0.05) > 0.5) {
        sparkC[i] = pack(190, 228, 255); sparkA[i] = 255;   // the sine makes bands of light drift across the water
      }
    }
  }
}
function previewCells() {                                // translucent ghost of what the tool will do
  if (moving) return [...moving].map(i => [i % W, Math.floor(i / W)]);
  if (!cur.over) return [];
  let cells = [];
  if (SHAPES.includes(tool)) cells = at(cur.x, cur.y, tool, ctl.size);
  else if (CREATURE_TYPES[tool] || FOOD_TYPES[tool]) {   // its silhouette, centred on the pointer
    const def = CREATURE_TYPES[tool] || FOOD_TYPES[tool], g = geomOf(def, CREATURE_TYPES[tool] ? creatureScale : 1);
    cells = g.mask.map(([dx, dy]) => [cur.x - (g.w >> 1) + dx, cur.y - (g.h >> 1) + dy]);
  }
  else if (DECOR_TYPES[tool]) cells = decorPixels(tool, cur.x, cur.y, decorScale()).map(p => [p[0], p[1]]);
  else if (tool === "erase") cells = at(cur.x, cur.y, eraseShape, Math.max(2, ctl.size >> 1));
  else if (tool === "pen") cells = at(cur.x, cur.y, "sphere", Math.max(1, Math.round(penWidth() / 2)));
  else if (tool === "wall") cells = at(cur.x, cur.y, "sphere", wallRadius());
  else if (tool === "ramp") cells = dragStart ? lineCells(dragStart[0], dragStart[1], ...rampEnd(dragStart, cur.x, cur.y)) : [[cur.x, cur.y]];
  else if (tool === "belt") cells = dragStart ? beltCells(dragStart[0], cur.x, dragStart[1]) : beltCells(cur.x, cur.x, cur.y);
  if (fx.mirror > 1 && !moving) cells = cells.flatMap(([x, y]) => mirroredXs(x).map(mx => [mx, y]));
  return cells;
}
function render(clean = false) {                         // clean = leave out the cursor ghost, selection box and seam lines
  buf.fill(0);                                           // see-through: the board's colour or picture and the ink show behind the sand
  if (fx.trails) for (let i = 0; i < buf.length; i++) if (trailA[i]) buf[i] = over(0, trailC[i], trailA[i]);
  const grid = sand.grid, colors = sand.colors;
  for (let i = 0; i < grid.length; i++) {
    const k = grid[i];
    if (k === STATIC || k === STILL_WATER) buf[i] = colors[i];
    else if (k >= SOLID && k <= CONVEYOR) buf[i] = objectColor(i, k);
  }
  if (fx.sparkle) for (let i = 0; i < buf.length; i++) if (sparkA[i]) { const k = grid[i]; if (k === STATIC || k === STILL_WATER) buf[i] = blend(buf[i], sparkC[i], sparkA[i]); }
  for (const f of sand.foods) drawFood(f);
  for (const c of sand.creatures) drawCreature(c);
  for (const g of sand.grains) buf[trunc(g.y) * W + trunc(g.x)] = g.color;
  if (fx.mirror > 1 && !clean) {                         // dashed lines where the strips meet
    for (const seam of MIRROR_EDGES[fx.mirror].slice(1, -1)) for (let y = 0; y < H; y++) if ((y >> 2) % 2 === 0 && seam < W) buf[y * W + seam] = SEAM;
  }
  if (pasting && cur.over && !clean) {                   // the copied area, in its own colours, centred on the pointer
    const ox = cur.x - (clipboard.w >> 1), oy = cur.y - (clipboard.h >> 1);
    for (const [dx, dy, kind, color] of clipboard.cells) {
      const x = ox + dx, y = oy + dy;
      if (x >= 0 && x < W && y >= 0 && y < H) buf[y * W + x] = over(buf[y * W + x], color || (kind === DRAIN ? P(THEME.trash) : P(THEME.shape)), 170);
    }
  }
  const box = clean ? null : currentSelRect();
  if (box) {                                             // dashed outline + faint tint over the selection
    const [x0, y0, x1, y1] = box, edge = P(selAnchor && selMode === "delete" ? THEME.danger : THEME.accent);
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
      const i = y * W + x, onEdge = x === x0 || x === x1 || y === y0 || y === y1;
      if (!onEdge) buf[i] = over(buf[i], edge, 28);
      else if (((x + y) >> 2) % 2 === 0) buf[i] = edge;
    }
  }
  const ghost = clean ? [] : previewCells();
  if (ghost.length) {
    const col = P(tool === "erase" ? THEME.danger : THEME.accent);
    for (const [x, y] of ghost) if (x >= 0 && x < W && y >= 0 && y < H) buf[y * W + x] = over(buf[y * W + x], col, 105);
  }
  ctx.putImageData(img, 0, 0);
}

// ---- main loop: physics at a steady 120 steps a second, whatever the screen's refresh rate ----
const STEP_MS = 1000 / 120;
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(now - last, 100);
  last = now;
  let steps = 0;
  while (acc >= STEP_MS && steps < 4) { simStep(); acc -= STEP_MS; steps++; }
  if (steps === 4) acc = 0;                              // can't keep up: drop the backlog instead of spiralling
  frameNo++;
  if (sand.conveyors.size && frameNo % 2 === 0) beltPhase++;
  if (dragStart && tool === "ramp") updateLabel();       // live angle and length while dragging a ramp
  updateFx();
  render();
  requestAnimationFrame(frame);
}
setTool("pour");
requestAnimationFrame(frame);
// ==== END APP ====
</script>
