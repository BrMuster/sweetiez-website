<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111217">
<title>Falling Pixels</title>
<style>
/* Layout: one screen. Header, the sand canvas filling what is left, an optional controls sheet, then the tool dock. */
:root {
  --bg: #111217;          /* page ground */
  --card: #1b1d25;        /* sheet, dock */
  --outline: #303442;
  --button: #282b37;
  --button-hover: #3a3f52;
  --accent: #6ea8ff;      /* the one blue */
  --accent-dim: #2a426e;
  --text: #e8eaf2;
  --text-dim: #8c92a5;
  --track: #343846;
  --shadow: #0b0c10;
  --ui: system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html {
  height: 100%;
  padding-top: env(safe-area-inset-top, 0px);       /* keep clear of the notch and home bar */
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: var(--bg);
}
@supports (height: 100dvh) { html { height: 100dvh; } }   /* phone browsers: the visible height, not the tallest */
body {
  height: 100%;
  margin: 0;
  touch-action: manipulation;                        /* no double-tap zoom */
  background: var(--bg);
  color: var(--text);
  font: 14px/1.3 var(--ui);
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { display: flex; align-items: center; gap: 10px; min-width: 0; }
.top h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: .01em; white-space: nowrap; }
.pill {
  flex: 1; min-width: 0; text-align: center; padding: 4px 12px; border-radius: 13px;
  background: var(--card); border: 1px solid var(--outline); color: var(--text-dim);
  font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.btn {
  min-height: 40px; padding: 0 14px; border-radius: 10px; cursor: pointer;
  background: var(--button); border: 1px solid var(--outline);
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap;
}
.btn:hover { background: var(--button-hover); }
.btn:active { transform: translateY(1px); }
.btn.on { background: var(--accent-dim); border-color: var(--accent); }

#stage { flex: 1; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; touch-action: none; }
/* The sandbox is a stack: the board's own background (colour or picture), then the ink canvas (pen drawings), then the sand canvas on top. */
#board {
  position: relative; border-radius: 12px; overflow: hidden; border: 1px solid var(--outline);
  background-color: #0a0a0e; background-size: cover; background-position: center;
  touch-action: none; -webkit-touch-callout: none;
}
#board canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#devRow .slider { flex: 1 1 140px; max-width: none; }
#sweep { position: absolute; left: 0; top: 0; bottom: 0; width: 0; display: none; pointer-events: none; z-index: 3;
  background: linear-gradient(90deg, rgba(255, 105, 105, 0), rgba(255, 105, 105, .45)); border-right: 3px solid rgba(255, 105, 105, .9); }
#sweep.armed { background: linear-gradient(90deg, rgba(255, 105, 105, .1), rgba(255, 105, 105, .7)); }
#c { image-rendering: pixelated; touch-action: none; }
#toast {
  position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); max-width: 90%;
  padding: 8px 16px; border-radius: 12px; background: var(--card); border: 1px solid var(--accent);
  opacity: 0; transition: opacity .3s; pointer-events: none; text-align: center;
}
#toast.show { opacity: 1; }
#selbar {
  position: absolute; left: 50%; top: 10px; transform: translateX(-50%); display: flex; gap: 8px; z-index: 2;
  padding: 6px; border-radius: 14px; background: var(--card); border: 1px solid var(--accent);
}
#selbar .btn { min-height: 36px; }

#sheet {
  flex: none; height: 42%; overflow-y: auto; overscroll-behavior: contain;
  background: var(--card); border: 1px solid var(--outline); border-radius: 16px; padding: 4px 16px 16px;
  -webkit-user-select: none; user-select: none;
}
#sheet h2 {
  margin: 16px 0 8px; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  color: var(--text-dim); display: flex; align-items: center; gap: 10px;
}
#sheet h2::after { content: ""; flex: 1; height: 1px; background: var(--outline); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 40px; }
.slider { display: grid; gap: 2px; padding: 4px 0; }
.slider .lab { display: flex; justify-content: space-between; gap: 8px; }
.slider output { color: var(--accent); font-variant-numeric: tabular-nums; }
input[type=color] {
  width: 56px; height: 34px; padding: 0; border: 1px solid var(--outline); border-radius: 8px;
  background: var(--button); cursor: pointer;
}

input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 30px; background: transparent; margin: 0; touch-action: pan-y; }
input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: var(--track); }
input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: var(--track); }
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 22px; height: 22px; margin-top: -8px; border-radius: 50%;
  background: #dde3f2; border: 5px solid var(--accent); box-shadow: 0 2px 0 var(--shadow);
}
input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: #dde3f2; border: 5px solid var(--accent); }

.dock { display: grid; gap: 8px; position: relative; }
.popmenu {
  position: absolute; z-index: 5; display: grid; grid-template-columns: repeat(3, 62px); gap: 8px; padding: 8px;
  border-radius: 14px; background: var(--card); border: 1px solid var(--accent); box-shadow: 0 8px 24px rgba(0, 0, 0, .55);
}
.quick { display: flex; align-items: center; gap: 12px; min-width: 0; }
.seg { display: flex; flex: none; border-radius: 10px; background: var(--button); border: 1px solid var(--outline); padding: 2px; }
.seg button { border: 0; background: transparent; min-height: 34px; padding: 0 14px; border-radius: 8px; color: var(--text-dim); cursor: pointer; }
.seg button.on { background: var(--accent-dim); color: var(--text); }
.seg.wide { width: 100%; }
.seg.wide button { flex: 1; }
.note { margin: 6px 0 0; color: var(--text-dim); font-size: 12px; }
/* the Size control: a small inline "Size ---o 8" instead of a full-width slider with its label stacked on top */
.pen { display: flex; align-items: center; gap: 8px; flex: none; }
.pen input[type=color] { width: 44px; }
.pair { display: flex; gap: 8px; }
.row .btn { min-height: 34px; }
.seg.compact button { padding: 0 11px; }
.dimlabel { color: var(--text-dim); font-size: 13px; white-space: nowrap; }
.quick.wrap { flex-wrap: wrap; }
#textInput {
  flex: 1 1 150px; min-width: 0; height: 36px; padding: 0 10px; border-radius: 10px; font: inherit;
  background: var(--button); color: var(--text); border: 1px solid var(--outline); -webkit-user-select: text; user-select: text;
}
#stats { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-dim); font-variant-numeric: tabular-nums; min-height: 16px; }
#stats b { color: var(--text); font-weight: 600; }
.tool span { max-width: 58px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini {
  min-height: 26px; padding: 0 10px; border-radius: 8px; font-size: 12px; letter-spacing: 0; text-transform: none;
  background: var(--button); border: 1px solid var(--outline); color: var(--text-dim); cursor: pointer;
}
.mini:hover { background: var(--button-hover); color: var(--text); }
#sheet h2 .mini { order: 2; }
.quick .slider { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; max-width: 230px; padding: 0; }
.quick .slider .lab { display: contents; }
.quick .slider .lab span { color: var(--text-dim); font-size: 13px; }
.quick .slider input { order: 1; flex: 1; min-width: 36px; height: 24px; }
.quick .slider output { order: 2; min-width: 1.4em; text-align: right; }
.quick input[type=range]::-webkit-slider-thumb { width: 18px; height: 18px; margin-top: -6px; border-width: 4px; }
.tools { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.tools::-webkit-scrollbar { display: none; }
.tool {
  flex: none; width: 62px; height: 62px; border-radius: 12px; cursor: pointer; position: relative;
  background: var(--button); border: 1px solid var(--outline); box-shadow: 0 3px 0 var(--shadow);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--text-dim);
}
.tool svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tool span { font-size: 11px; }
.tool.on { background: var(--accent-dim); border-color: var(--accent); color: var(--text); }
.tool.on svg { color: var(--accent); }
.tool.ctl { position: sticky; right: 0; margin-left: auto; box-shadow: 0 3px 0 var(--shadow), -14px 0 12px -2px var(--bg); }
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } .btn:active { transform: none; } }

/* Wide screens (a computer): the controls stay open as a side panel, like a desktop app, instead of sliding up from the bottom. */
@media (min-width: 860px) {
  body { display: grid; grid-template-columns: minmax(0, 1fr) 300px; grid-template-rows: auto auto minmax(0, 1fr) auto; gap: 8px 16px; }
  .top { grid-column: 1; grid-row: 1; }
  #stats { grid-column: 1; grid-row: 2; }
  #stage { grid-column: 1; grid-row: 3; }
  .dock { grid-column: 1; grid-row: 4; min-width: 0; }
  #sheet { display: block !important; grid-column: 2; grid-row: 1 / 5; height: auto; min-height: 0; contain: size; }
  #ctlBtn { display: none; }
}
</style>
</head>
<body>

<header class="top">
  <a class="btn" href="index.html" aria-label="Home" style="padding:0 12px">&#8249;</a>
  <h1>Falling Pixels</h1>
  <div class="pill" id="label">Pour · sand</div>
  <button class="btn" id="stopBtn" aria-label="Stop the simulation" title="Stop everything instantly if it gets laggy (tap again to run; Esc on a keyboard)" style="padding:0 12px;min-width:48px;color:#ff6b6b;border-color:#ff6b6b">&#9632; Stop</button>
  <button class="btn" id="speedBtn"aria-label="Simulation speed" title="Simulation speed: tap to speed up (] and [ on a keyboard, Space pauses)" style="padding:0 12px;min-width:48px">1×</button>
  <button class="btn" id="shotBtn" aria-label="Save a picture of the sandbox" title="Save a picture of the sandbox" style="padding:0 12px">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
  </button>
</header>
<div id="stats" title="Every grain of sand and water you have poured or emitted"></div>

<main id="stage">
  <div id="board">
    <canvas id="ink" aria-hidden="true"></canvas>
    <canvas id="c" aria-label="Sand simulation: touch and drag to use the selected tool"></canvas>
    <div id="sweep" aria-hidden="true"></div>
  </div>
  <div id="selbar" hidden>
    <button class="btn" id="selCopy">Copy</button><button class="btn" id="selDelete">Delete</button>
    <button class="btn" id="selDone">Done</button>
  </div>
  <div id="toast" role="status"></div>
</main>

<section id="sheet" hidden aria-label="Controls"></section>

<nav class="dock" id="dock" aria-label="Tools">
  <div class="quick">
    <div class="seg" id="matSeg" role="group" aria-label="Material">
      <button id="mSand" class="on">Sand</button><button id="mWater">Water</button><button id="mAcid" title="Eats sand, walls and scenery">Acid</button><button id="mFire" title="Fire: with Pour it paints flames, with Emitter it makes a flame jet">Fire</button>
    </div>
    <div class="pen" id="laserTools" hidden>
      <div class="seg compact" id="laserModeSeg" role="group" aria-label="Laser mode">
        <button data-m="hold" class="on" title="Fires while you hold">Hold</button><button data-m="turret" title="Drag to aim, let go to leave a laser that keeps firing">Turret</button><button data-m="dots" title="Drag to aim, let go to leave a laser that shoots dots">Dots</button>
      </div>
      <div class="slider" style="max-width:150px"><div class="lab"><span>Width</span><output id="laserWidthOut">1</output></div><input type="range" id="laserWidth" min="1" max="6" step="1" value="1" aria-label="Laser width"></div>
      <input type="color" id="laserColor" value="#ff2446" aria-label="Laser colour">
    </div>
    <div class="pen" id="creatureTools" hidden>
      <input type="color" id="creatureColor" value="#7ddc6a" aria-label="Creature colour">
      <button class="btn on" id="creatureNatural" title="Use the creature's own colours">Natural</button>
      <div class="seg compact" id="creatureScaleSeg" role="group" aria-label="Creature size">
        <button data-s="1" class="on">1×</button><button data-s="2">2×</button><button data-s="3">3×</button><button data-s="4">4×</button>
      </div>
    </div>
    <div class="pen" id="sceneryTools" hidden>
      <button class="btn decorDestruct" title="Whether fire, acid and lasers can destroy scenery and theme objects">Destructible: on</button>
      <span class="dimlabel">Scenery size</span>
      <div class="seg compact" id="sceneryScaleSeg" role="group" aria-label="Scenery size">
        <button data-s="1" class="on">1×</button><button data-s="2">2×</button><button data-s="3">3×</button><button data-s="4">4×</button><button data-s="5">5×</button><button data-s="6">6×</button>
      </div>
    </div>
    <div class="pen" id="penTools" hidden><input type="color" id="penColor" value="#ffffff" aria-label="Pen color"><button class="btn" id="penUndo">Undo</button></div>
    <div class="slider" id="sizeBox"><div class="lab"><span>Size</span><output id="sizeOut"></output></div><input type="range" id="sizeRange" aria-label="Size"></div>
    <button class="btn" id="bSnap" hidden aria-label="Ramp snapping">Snap: off</button>
    <button class="btn" id="bHollow" hidden aria-label="Solid or hollow shape">Solid</button>
    <div class="pen" id="shapeTools" hidden>
      <span class="dimlabel">Shape colour</span><input type="color" id="shapeColor" value="#7aa2ff" aria-label="Shape colour">
      <button class="btn on" id="shapeGrey" title="Plain grey shapes">Grey</button>
      <button class="btn" id="shapeDestruct" title="Whether fire and acid can destroy the shapes you draw">Destructible: off</button>
    </div>
  </div>
  <div class="quick wrap" id="devRow" hidden>
    <div class="slider"><div class="lab"><span>Angle</span><output id="dAngleOut"></output></div><input type="range" id="dAngle" min="0" max="359" step="1" value="90" aria-label="Angle"></div>
    <div class="slider"><div class="lab"><span>Spin</span><output id="dSpinOut"></output></div><input type="range" id="dSpin" min="-180" max="180" step="5" value="0" aria-label="Spin in degrees a second"></div>
    <div class="slider" id="dSizeBox" hidden><div class="lab"><span>Fan size</span><output id="dSizeOut"></output></div><input type="range" id="dSize" min="1" max="4" step="0.5" value="1" aria-label="Fan size"></div>
    <div class="slider" id="dPowerBox"><div class="lab"><span id="dPowerLab">Push</span><output id="dPowerOut"></output></div><input type="range" id="dPower" min="0" max="8" step="0.5" value="0" aria-label="Power"></div>
  </div>
  <div class="quick wrap" id="textRow" hidden>
    <input type="text" id="textInput" maxlength="40" placeholder="Type your text, then tap the sand" aria-label="Text to place" autocomplete="off" spellcheck="false">
    <input type="color" id="textColor" value="#ffd84a" aria-label="Text colour">
    <button class="btn decorDestruct" title="Whether fire, acid and lasers can destroy barrier text">Destructible: on</button>
    <button class="btn" id="textStamp" title="Fill in the current date and time (tap again to cycle: date and time, time, date)">Timestamp</button>
    <div class="seg compact" id="textModeSeg" role="group" aria-label="Barrier or paint">
      <button data-m="solid" class="on" title="Sand piles on it">Barrier</button><button data-m="paint" title="Decoration only: sand ignores it">Paint</button><button data-m="emitter" title="The letters are an emitter: they pour sand, water, acid or fire">Pours</button><button data-m="shoots" title="An emitter that shoots your text out, letters and all">Shoots</button>
    </div>
    <div class="seg compact" id="textScaleSeg" role="group" aria-label="Text size">
      <button data-s="1">1×</button><button data-s="2" class="on">2×</button><button data-s="3">3×</button><button data-s="4">4×</button>
    </div>
  </div>
  <div class="tools" id="tools"></div>
</nav>

<script>
// If anything goes wrong, show the message on screen (handy when there's no developer console, like on a phone).
window.addEventListener("error", e => {
  const d = document.createElement("div");
  d.style.cssText = "position:fixed;left:8px;right:8px;top:8px;z-index:99;background:#5a1f26;color:#fff;padding:10px;border-radius:8px;font:12px monospace;white-space:pre-wrap;user-select:text";
  d.textContent = "Error: " + e.message + " (line " + e.lineno + ")";
  document.body.appendChild(d);
});
</script>
<script>
// ==== PHYSICS ====
// Grid cell states (same numbers as the Python version)
const EMPTY = 0, STATIC = 1, IN_AIR = 2, STACKING = 3, SOLID = 4, DRAIN = 5, EMITTER = 6, CONVEYOR = 7, STILL_WATER = 8;
const SAND = 0, WATER = 1, ACID = 2;                     // ACID is a menu choice only: its grains are WATER grains with `acid` set
const WATER_PATIENCE = 120;
const MAX_TURRETS = 12, MAX_PRINTERS = 8, MAX_FANS = 8, MAX_BOLTS = 600, BOLT_SPEED = 2.5;
const FLAME = 3;                                         // an emitter kind (and a menu material) that makes fire instead of grains
const SPIN_STEP = Math.PI / 180 / 120;                   // one degree per second, as radians per physics step (there are 120 a second)
const DEFAULT_LASER = [255, 36, 70];
const ALPHA_PROT_PLAIN = 252, ALPHA_DEST_PLAIN = 253, ALPHA_DEST_PAINT = 251;   // shape colours carry a flag in their alpha: can fire and acid destroy this shape?
const ALPHA_DECOR_PROT = 250;                            // scenery / theme objects / barrier text marked "Destructible: off" (plain scenery keeps alpha 255)
const SHAPE_ALPHA = 254;                                // a painted shape's colour has this alpha, so fire can tell it from flammable scenery (alpha 255)
const N4 = [[0, 1], [-1, 0], [1, 0], [0, -1]];            // the four cells touching a cell: below, left, right, above
const N8 = [...N4, [-1, 1], [1, 1], [-1, -1], [1, -1]];   // ...and the four corners as well
const CREATURE = 9, FOOD = 10;                           // a creature's body, and a piece of food (see CREATURE_TYPES, FOOD_TYPES)
const FIRM = new Uint8Array(11);
[STATIC, SOLID, EMITTER, CONVEYOR, STILL_WATER, CREATURE, FOOD].forEach(k => { FIRM[k] = 1; });
const isBody = k => k === CREATURE || k === FOOD;        // things that live in the world but are not "objects" you can place and erase
const isObj = k => k >= SOLID && k <= CONVEYOR;
const trunc = Math.trunc;

// colours are packed into one number per pixel (r, g, b, opaque), ready to write into the canvas
const pack = (r, g, b) => ((255 << 24) | (b << 16) | (g << 8) | r) >>> 0;
const DEFAULT_COLOR = pack(230, 200, 120);
function shaded(rgb, shade) {
  const k = 1 - shade + Math.random() * 2 * shade;
  return pack(Math.min(255, (rgb[0] * k) | 0), Math.min(255, (rgb[1] * k) | 0), Math.min(255, (rgb[2] * k) | 0));
}

class Grain {
  constructor(x, y, vx, vy, color, kind) {
    this.x = x; this.y = y; this.vx = vx; this.vy = vy;
    this.status = IN_AIR; this.color = color; this.kind = kind; this.idle = 0;
    this.acid = false; this.charge = 0;                  // acid eats `charge` worth of sand and walls, then it is used up
  }
}
const newAcidCharge = () => 4 + Math.floor(Math.random() * 5);

// ---- creatures: tiny pixel animals made of the same pixels as the sand ----
// rows: the sprite ("." = see-through, letters are colours: see PIXEL_COLORS). Sand treats the coloured pixels as solid.
// every: ticks between steps (smaller = faster).  step: the tallest ledge it climbs at 1x.  walk / rest: how long, in ticks (30 a second).
// likes: foods that make it grow.  water: "love" swims and splashes, "hate" avoids pools and runs from a soaking, "neutral" doesn't mind.  body: the colour letters a custom colour replaces, each with how bright it is.
const STATS = { sand: 0, water: 0 };                     // how many grains were ever poured or emitted (the status bar shows this)
const MAX_CREATURES = 30, MAX_FOODS = 40, MAX_SCALE = 4, VISION = 80;
const CREATURE_TYPES = {
  slime: { rows: ["..gggg..", ".gGGGGg.", "gGkGGkGg", "gGGGGGGg", "gGGGGGGg", ".gggggg."], every: 8, step: 2, walk: [40, 140], rest: [30, 120],
    likes: ["berry", "apple"], water: "love", body: { g: 0.6, G: 1 } },
  bunny: { rows: [".w...w.", ".w...w.", ".wwwww.", "wwwwwww", "wkwwwkw", "wwwpwww", ".wwwww.", ".w...w."], every: 3, step: 4, walk: [6, 15], rest: [25, 90],
    likes: ["carrot", "apple"], water: "hate", body: { w: 1 } },
  chick: { rows: ["..yyy..", ".yyyyy.", ".ykyky.", ".yyoyy.", "yyyyyyy", ".yyyyy.", "..o.o.."], every: 5, step: 3, walk: [30, 100], rest: [15, 60], peck: true,
    likes: ["seed", "berry"], water: "hate", body: { y: 1 } },
  bird: { rows: ["..bbb..", ".bbbbb.", ".bkbkb.", ".bbobb.", "bbbbbbb", "..o.o.."], flyRows: ["b.bbb.b", "bbbbbbb", ".bkbkb.", ".bbobb.", "..bbb..", "..o.o.."],
    fly: true, every: 2, step: 3, walk: [20, 60], rest: [30, 100], likes: ["seed", "berry"], water: "neutral", body: { b: 1 } },
  cat: { rows: ["oo....oo", "oooooooo", "okooooko", "oooppooo", "oOooooOo", ".oooooo.", ".oOooOo.", ".oo..oo."], every: 6, step: 6, walk: [30, 90], rest: [60, 220],
    likes: ["fish"], water: "hate", body: { o: 1, O: 0.65 } },

// ---------- shape outlines (offsets from the cursor) ----------
const shapeCache = new Map();
function shapeCells(name, r) {
  const key = name + r;
  if (shapeCache.has(key)) return shapeCache.get(key);
  const cells = [];
  if (name === "sphere") {                               // filled circle
    for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) if (dx * dx + dy * dy <= r * r + 1) cells.push([dx, dy]);
  } else if (name === "cone") {                          // triangle, apex up, widens going down
    for (let dy = -r; dy <= r; dy++) { const half = Math.floor((dy + r) / 2); for (let dx = -half; dx <= half; dx++) cells.push([dx, dy]); }
  } else if (name === "box") {
    for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) cells.push([dx, dy]);
  } else if (name === "emitter") {                       // a spout: wide and 3 cells thick
    for (let dy = -1; dy <= 1; dy++) for (let dx = -r; dx <= r; dx++) cells.push([dx, dy]);
  } else if (name === "trash") {                         // a wide bar, 4 cells thick
    for (let dy = -2; dy <= 1; dy++) for (let dx = -r; dx <= r; dx++) cells.push([dx, dy]);
  } else if (name === "bowl") {                          // lower half of a hollow circle
    for (let dy = 0; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
      const d2 = dx * dx + dy * dy;
      if ((r - 2) * (r - 2) <= d2 && d2 <= r * r) cells.push([dx, dy - Math.floor(r / 2)]);
    }
  }
  shapeCache.set(key, cells);
  return cells;
}

const hollowCache = new Map();
function hollowCells(name, r, t) {
  const key = name + ":" + r + ":" + t;
  if (hollowCache.has(key)) return hollowCache.get(key);
  const n = 2 * r + 3, at = (dx, dy) => (dy + r + 1) * n + (dx + r + 1);
  let inner = new Uint8Array(n * n);
  const cells = shapeCells(name, r);
  for (const [dx, dy] of cells) inner[at(dx, dy)] = 1;
  for (let step = 0; step < t; step++) {                 // peel off the outermost layer t times; what is left is the inside
    const next = new Uint8Array(n * n);
    for (const [dx, dy] of cells) {
      if (inner[at(dx, dy)] && inner[at(dx + 1, dy)] && inner[at(dx - 1, dy)] && inner[at(dx, dy + 1)] && inner[at(dx, dy - 1)]) next[at(dx, dy)] = 1;
    }
    inner = next;
  }
  const out = cells.filter(([dx, dy]) => !inner[at(dx, dy)]);
  hollowCache.set(key, out);
  return out;
}

function beltCells(x0, x1, y) {                          // a conveyor belt: a horizontal bar, 3 cells thick
  const out = [];
  for (let x = Math.min(x0, x1); x <= Math.max(x0, x1); x++) for (let dy = -1; dy <= 1; dy++) out.push([x, y + dy]);
  return out;
}

function lineCells(x0, y0, x1, y1) {                     // Bresenham line, 2 cells thick so sand can't squeeze through
  const seen = new Map();
  const dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx - dy, x = x0, y = y0;
  for (;;) {
    for (const ox of [0, 1]) for (const oy of [0, 1]) seen.set((x + ox) + "," + (y + oy), [x + ox, y + oy]);
    if (x === x1 && y === y1) break;
    const e2 = 2 * err;
    if (e2 > -dy) { err -= dy; x += sx; }
    if (e2 < dx) { err += dx; y += sy; }
  }
  return [...seen.values()];
}

const norm360 = deg => ((Math.round(deg) % 360) + 360) % 360;
const selType = () => (selDev ? selDev.type : tool);
const powerIsFan = () => selType() === "fan";
function syncDevUi() {                                   // the sliders show what is set for the next placement, or for the picked device
  $("dAngle").value = devAngle; $("dAngleOut").textContent = devAngle + "°";
  $("dSpin").value = devSpin; $("dSpinOut").textContent = devSpin;
  const fan = powerIsFan();
  $("dPowerLab").textContent = fan ? "Speed" : "Push";
  $("dPower").max = fan ? 10 : 8;
  $("dPower").value = fan ? fanSpeed : emitPush; $("dPowerOut").textContent = fan ? fanSpeed : emitPush;
  $("dPowerBox").hidden = selType() === "laser";
  $("dSizeBox").hidden = !fan;

  $("laserWidth").value = laserWidth; $("laserWidthOut").textContent = laserWidth; $("laserColor").value = laserColor;
}
function applyToDevice(field) {                          // change one setting of the picked device
  const d = selDev;
  if (!d) return;
  const ang = devAngle * Math.PI / 180;
  if (d.type === "fan") {
    if (field === "angle") d.ref.ang = ang; else if (field === "spin") d.ref.spin = devSpin; else if (field === "power") d.ref.speed = fanSpeed; else if (field === "size") d.ref.size = devSize;
  } else if (d.type === "printer") {
    if (field === "angle") d.ref.ang = ang; else if (field === "spin") d.ref.spin = devSpin; else if (field === "power") d.ref.push = emitPush;
  } else if (d.type === "laser") {
    if (field === "angle") d.ref.ang = ang; else if (field === "spin") d.ref.spin = devSpin;
    else if (field === "width") d.ref.w = laserWidth; else if (field === "color") d.ref.rgb = laserRgb.slice();
  } else {
    for (const i of d.ref) {
      const p = sand.emitters.get(i);
      if (!p) continue;
      if (field === "angle") p[3] = ang; else if (field === "spin") p[4] = devSpin; else if (field === "power") p[5] = emitPush;
    }
  }
}
$("dAngle").addEventListener("input", e => { devAngle = +e.target.value; $("dAngleOut").textContent = devAngle + "°"; applyToDevice("angle"); });
$("dSpin").addEventListener("input", e => { devSpin = +e.target.value; $("dSpinOut").textContent = devSpin; applyToDevice("spin"); });
$("dPower").addEventListener("input", e => {

function deviceAt(x, y) {                                // the fan, laser or emitter under the pointer
  let best = null, bd = 40;
  for (const f of sand.fans) { const d = (f.x - x) ** 2 + (f.y - y) ** 2, lim = Math.max(40, (3 * (f.size || 1)) ** 2); if (d < lim && d < bd) { bd = d; best = { type: "fan", ref: f, cx: f.x, cy: f.y }; } }
  for (const t of sand.printers) { const d = (t.x - x) ** 2 + (t.y - y) ** 2; if (d < bd) { bd = d; best = { type: "printer", ref: t, cx: t.x, cy: t.y }; } }
  for (const t of sand.turrets) { const d = (t.x - x) ** 2 + (t.y - y) ** 2; if (d < bd) { bd = d; best = { type: "laser", ref: t, cx: t.x, cy: t.y }; } }
  if (best) return best;
  for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
    const px = x + dx, py = y + dy;
    if (px < 0 || px >= W || py < 0 || py >= H || sand.grid[py * W + px] !== EMITTER) continue;
    const cells = sand.solidObject(px, py);
    let sx = 0, sy = 0;
    for (const i of cells) { sx += i % W; sy += Math.floor(i / W); }
    return { type: "emitter", ref: cells, cx: sx / cells.size, cy: sy / cells.size };
  }
  return null;
}
function selectDevice(d) {                               // pick it (or nothing) and show its settings in the sliders
  selDev = d;
  if (d) {
    if (d.type === "fan") { devAngle = norm360(d.ref.ang * 180 / Math.PI); devSpin = d.ref.spin; fanSpeed = d.ref.speed; devSize = d.ref.size || 1; }
    else if (d.type === "printer") { devAngle = norm360(d.ref.ang * 180 / Math.PI); devSpin = d.ref.spin; emitPush = d.ref.push; }
    else if (d.type === "laser") { devAngle = norm360(d.ref.ang * 180 / Math.PI); devSpin = d.ref.spin; laserWidth = d.ref.w; laserRgb = d.ref.rgb.slice(); laserColor = rgbToHex(laserRgb); }
    else {
      const p = sand.emitters.get(d.ref.values().next().value) || [];
      devAngle = p[3] === undefined ? 90 : norm360(p[3] * 180 / Math.PI); devSpin = p[4] || 0; emitPush = p[5] || 0;
    }
  }
  $("laserTools").hidden = !(tool === "laser" || (tool === "adjust" && selDev && selDev.type === "laser"));   // a picked laser shows its width and colour
  syncDevUi(); updateLabel();
}
let adjStart = null, adjActive = false;                  // the Adjust tool: where the press began, and whether it has become an aiming drag
function aimSelected(x, y) {                             // while dragging with Adjust, the device turns to face the pointer
  if (!selDev || !adjStart) return;

  adjActive = true;
  const dx = x - selDev.cx, dy = y - selDev.cy;

  devAngle = norm360(Math.atan2(dy, dx) * 180 / Math.PI);
  applyToDevice("angle"); syncDevUi();
}
function selectionAlive() {
  if (!selDev) return true;
  if (selDev.type === "fan") return sand.fans.includes(selDev.ref);
  if (selDev.type === "laser") return sand.turrets.includes(selDev.ref);
  if (selDev.type === "printer") return sand.printers.includes(selDev.ref);
  return sand.grid[selDev.ref.values().next().value] === EMITTER;
}

let sweep = null;
function boardRect() { return canvas.getBoundingClientRect(); }
document.addEventListener("pointerdown", e => {
  if (e.target.closest("button, input, select, textarea, .popmenu, #sheet, #dock, header, #selbar, #toast")) return;
  const r = boardRect();
  if (e.clientX < r.left && e.clientY > r.top - 30 && e.clientY < r.bottom + 30) sweep = { x0: e.clientX, y0: e.clientY, id: e.pointerId };

});

  while (acc >= STEP_MS && steps < cap) { simStep(); acc -= STEP_MS; steps++; }
  if (steps === cap) acc = 0;                            // can't keep up: drop the backlog instead of spiralling
  frameNo++;
  if (sand.conveyors.size && frameNo % 2 === 0) beltPhase++;
  if (dragStart && tool === "ramp") updateLabel();       // live angle and length while dragging a ramp
  if (frameNo % 15 === 0) updateStats();
  if (selDev) {
    if (!selectionAlive()) { selDev = null; syncDevUi(); updateLabel(); }                      // it was erased, or the scene was cleared
    else if (devSpin && selDev.type !== "emitter" && frameNo % 4 === 0) { devAngle = norm360(selDev.ref.ang * 180 / Math.PI); syncDevUi(); }   // follow a spinning device
    else if (devSpin && selDev.type === "emitter" && frameNo % 4 === 0) { const p = sand.emitters.get(selDev.ref.values().next().value); if (p) { devAngle = norm360(p[3] * 180 / Math.PI); syncDevUi(); } }
  }
  updateFx();
  render();
  requestAnimationFrame(frame);
}
setTool("pour");
syncDecorDestructUi();
updateStats();                                            // draw the status bar right away
requestAnimationFrame(frame);
// ==== END APP ====
</script>
</body>
