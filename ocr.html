<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self' data: blob:; img-src 'self' data: blob:; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Image to Text</title>
<style>
  :root { --bg: #f3eee8; --ink: #2a2118; --muted: #6d6256; --line: #cfc5ba; --card: #fff; --accent: #0f7b8a; --font: "Segoe UI", system-ui, sans-serif; }
  * { box-sizing: border-box; margin: 0; }
  [hidden] { display: none !important; }
  body { min-height: 100vh; padding: 1rem; padding-top: calc(1rem + env(safe-area-inset-top, 0px)); padding-bottom: calc(1rem + env(safe-area-inset-bottom, 0px)); background: var(--bg); color: var(--ink); font: 16px/1.45 var(--font); }
  main { max-width: 1200px; margin: 0 auto; display: grid; gap: 1rem; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; }
  h1 { font-size: 1.7rem; font-weight: 600; }
  h2 { font-size: 1.05rem; font-weight: 600; }
  a.home { color: var(--muted); text-decoration: none; } a.home:hover { color: var(--ink); }
  .hint { color: var(--muted); font-size: .9rem; }
  .drop { display: grid; gap: .6rem; justify-items: center; text-align: center; padding: 1.4rem 1rem; border: 2px dashed var(--line); border-radius: 16px; background: #ffffff80; transition: background .15s, border-color .15s; }
  .drop.over { background: #fff; border-color: var(--accent); }
  .drop .big { font-size: 1.15rem; font-weight: 600; }
  .row { display: flex; flex-wrap: wrap; gap: .5rem .9rem; align-items: center; }
  button, .btn { font: inherit; padding: .5rem .95rem; border: 0; border-radius: 10px; background: var(--ink); color: #fff; cursor: pointer; }
  button.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); }
  button:disabled { opacity: .45; cursor: default; }
  button.ok { background: var(--accent); }
  select, textarea { font: inherit; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: .45rem .65rem; }
  select { max-width: 100%; }
  textarea { width: 100%; min-height: 12rem; resize: vertical; font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: .95rem; line-height: 1.4; white-space: pre; overflow: auto; }
  label { display: inline-flex; align-items: center; gap: .4rem; cursor: pointer; }
  input[type=checkbox], input[type=radio] { accent-color: var(--accent); width: 1.05rem; height: 1.05rem; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .cols { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 1rem; align-items: start; }
  @media (max-width: 820px) { .cols { grid-template-columns: 1fr; } }
  .pane { display: grid; gap: .8rem; padding: 1rem; background: var(--card); border: 1px solid var(--line); border-radius: 16px; }
  .pic { display: grid; place-items: center; min-height: 8rem; max-height: 26rem; overflow: auto; background: #f7f3ee; border: 1px solid var(--line); border-radius: 10px; padding: .4rem; }
  .pic img { max-width: 100%; height: auto; display: block; }
  .pic .hint { padding: 1.5rem 1rem; text-align: center; }
  .bar { height: 8px; border-radius: 99px; background: #e6dfd6; overflow: hidden; } .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .status { min-height: 1.3em; color: var(--muted); font-size: .92rem; } .status.err { color: #b3261e; }
  fieldset { border: 1px solid var(--line); border-radius: 12px; padding: .55rem .8rem .7rem; display: flex; flex-wrap: wrap; gap: .4rem 1rem; align-items: center; } legend { padding: 0 .4rem; color: var(--muted); font-size: .85rem; }
  .count { color: var(--muted); font-size: .9rem; margin-left: auto; }
</style>
</head>
<body>
<main>
  <header><h1>Image to Text</h1><a class="home" href="index.html">← Home</a></header>

  <section class="drop" id="drop" aria-label="Add a picture">
    <div class="big">Paste a screenshot (Ctrl + V), or drop a picture here</div>
    <div class="row">
      <button type="button" id="choose">Choose a picture</button>
      <button type="button" class="ghost" id="pasteBtn" title="Paste the picture you copied or screenshotted">Paste</button>
      <input type="file" id="file" accept="image/*" hidden>
    </div>
    <p class="hint">The picture is read right here in your browser. Nothing is uploaded.</p>
  </section>

  <div class="cols">
    <section class="pane" aria-label="The picture">
      <h2>Picture</h2>
      <div class="pic" id="pic"><p class="hint" id="picHint">No picture yet.</p><img id="preview" alt="The picture to read" hidden></div>
      <fieldset>
        <legend>How to read it</legend>
        <label>Text is <select id="psm" aria-label="What kind of text the picture holds">
          <option value="3">paragraphs or a page (automatic)</option>
          <option value="6">one block of lines, like a list or a column</option>
          <option value="11">scattered, like a table or a form</option>
        </select></label>
        <label title="Only 0 to 9 and number punctuation are allowed, which stops letters being guessed in place of digits"><input type="checkbox" id="digits"> Numbers only</label>
        <label title="Light text on a dark background is turned around first. This is picked for you when the picture is mostly dark."><input type="checkbox" id="invert"> Light text on dark</label>
      </fieldset>
    </section>

    <section class="pane" aria-label="The text">
      <div class="row"><h2>Text it found</h2><span class="hint">You can fix mistakes here and the result below follows.</span></div>
      <div class="bar" id="bar" hidden><i id="barFill"></i></div>
      <p class="status" id="status" role="status"></p>
      <textarea id="raw" spellcheck="false" aria-label="The text found in the picture" placeholder="The text from your picture appears here."></textarea>

      <h2>Result</h2>
      <fieldset>
        <legend>Layout</legend>
        <label><input type="radio" name="layout" value="asis" checked> As it is</label>
        <label><input type="radio" name="layout" value="col"> One column</label>
        <label><input type="radio" name="layout" value="row"> One row</label>
      </fieldset>
      <fieldset id="opts">
        <legend>Column and row options</legend>
        <label>Each item is a <select id="unit"><option value="lines">whole line</option><option value="words">single word or number</option></select></label>
        <label>Row separator <select id="sep"><option value="tab">Tab (pastes across Excel cells)</option><option value="comma">Comma</option><option value="space">Space</option></select></label>
      </fieldset>
      <div class="row">
        <label><input type="checkbox" id="tidy" checked> Tidy extra spaces</label>
        <label><input type="checkbox" id="skip" checked> Skip blank lines</label>
      </div>
      <textarea id="out" readonly spellcheck="false" aria-label="The result" placeholder="The result appears here."></textarea>
      <div class="row"><button type="button" id="copy" disabled>Copy</button><button type="button" class="ghost" id="clear">Clear</button><span class="count" id="count"></span></div>
    </section>
  </div>
</main>

<script src="vendor/tesseract/tesseract.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const V = "vendor/tesseract/";
let worker = null, starting = null, busy = false, again = false, shot = null;   // shot: { url, bmp } the picture now loaded

const say = (t, err) => { $("status").textContent = t; $("status").classList.toggle("err", !!err); };
const bar = p => { $("bar").hidden = p === null; $("barFill").style.width = Math.round((p || 0) * 100) + "%"; };

// ---------- reading ----------
async function getWorker() {                       // the reader loads once, the first time it is needed (about 10 MB, then kept by the browser)
  if (worker) return worker;
  if (starting) return starting;
  say("Loading the reader. This takes a few seconds the first time only…"); bar(0);
  starting = Tesseract.createWorker("eng", 1, {
    workerPath: V + "worker.min.js", corePath: V + "core", langPath: V + "lang", workerBlobURL: false,
    logger: m => { if (busy && m.status === "recognizing text") { say("Reading the picture…"); bar(m.progress); } else if (/loading|initializ/.test(m.status || "")) bar(Math.min(.95, m.progress || 0)); }
  }).then(w => (worker = w), e => { starting = null; throw e; });
  return starting;
}
async function prepare() {                         // bigger, grey, framed in white, and turned around if the text is light: all of which help it read
  const bmp = shot.bmp, big = Math.max(bmp.width, bmp.height);
  let k = big < 1000 ? 3 : big < 2000 ? 2 : 1; while (k > 1 && bmp.width * bmp.height * k * k > 16e6) k--;
  const pad = 24, c = document.createElement("canvas"); c.width = Math.round(bmp.width * k) + pad * 2; c.height = Math.round(bmp.height * k) + pad * 2;
  const x = c.getContext("2d", { willReadFrequently: true }); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height);
  x.imageSmoothingQuality = "high"; x.drawImage(bmp, pad, pad, c.width - pad * 2, c.height - pad * 2);
  const d = x.getImageData(0, 0, c.width, c.height), p = d.data, inv = $("invert").checked;
  for (let i = 0; i < p.length; i += 4) { let g = .299 * p[i] + .587 * p[i + 1] + .114 * p[i + 2]; if (inv) g = 255 - g; p[i] = p[i + 1] = p[i + 2] = g; p[i + 3] = 255; }
  x.putImageData(d, 0, 0); return c;
}
async function read() {                            // one reading at a time; a change made meanwhile reads again afterwards
  if (!shot) return;
  if (busy) { again = true; return; }
  busy = true; again = false; $("copy").disabled = true;
  try {
    const w = await getWorker(); say("Reading the picture…"); bar(0);
    await w.setParameters({ tessedit_pageseg_mode: $("psm").value, preserve_interword_spaces: "1", tessedit_char_whitelist: $("digits").checked ? "0123456789.,+-−–%()/:eE " : "" });
    const { data } = await w.recognize(await prepare());
    $("raw").value = data.text.replace(/\s+$/, "");
    say($("raw").value.trim() ? "Done. Check the numbers and names against the picture." : "I couldn't find any text. Try another reading style above, or a sharper picture.");
    format();
  } catch (e) {
    console.error(e);
    say(location.protocol === "file:" ? "The reader can't start from a saved file. Open this page from the website instead." : "Sorry, the reader couldn't start (" + (e && e.message || e) + ").", true);
  } finally { busy = false; bar(null); if (again) read(); }
}

// ---------- the picture ----------
async function load(blob) {
  if (!blob || !/^image\//.test(blob.type)) return say("That isn't a picture. Use a screenshot or a photo (PNG, JPG, and so on).", true);
  let bmp; try { bmp = await createImageBitmap(blob, { imageOrientation: "from-image" }); } catch (e) { return say("I couldn't open that picture.", true); }
  say("Reading the picture…");
  if (shot) URL.revokeObjectURL(shot.url);
  shot = { url: URL.createObjectURL(blob), bmp };
  $("preview").src = shot.url; $("preview").hidden = false; $("picHint").hidden = true;
  const t = document.createElement("canvas"); t.width = 64; t.height = Math.max(1, Math.round(64 * bmp.height / bmp.width));   // is it mostly dark? then the text is probably light
  const tx = t.getContext("2d", { willReadFrequently: true }); tx.drawImage(bmp, 0, 0, t.width, t.height);
  const px = tx.getImageData(0, 0, t.width, t.height).data; let s = 0; for (let i = 0; i < px.length; i += 4) s += .299 * px[i] + .587 * px[i + 1] + .114 * px[i + 2];
  $("invert").checked = s / (px.length / 4) < 110;
  read();
}
$("choose").onclick = () => $("file").click();
$("file").onchange = () => { load($("file").files[0]); $("file").value = ""; };
$("pasteBtn").onclick = async () => {
  try { for (const it of await navigator.clipboard.read()) { const t = it.types.find(t => t.startsWith("image/")); if (t) return load(await it.getType(t)); } say("There's no picture on the clipboard. Take a screenshot first (on Windows: Win + Shift + S).", true); }
  catch (e) { say("Your browser didn't allow that. Press Ctrl + V on this page instead.", true); }
};
addEventListener("paste", e => { const f = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith("image/")); if (f) { e.preventDefault(); load(f.getAsFile()); } });
const drop = $("drop");
addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
addEventListener("dragleave", e => { if (!e.relatedTarget) drop.classList.remove("over"); });
addEventListener("drop", e => { e.preventDefault(); drop.classList.remove("over"); load([...e.dataTransfer.files].find(f => f.type.startsWith("image/")) || e.dataTransfer.files[0]); });
for (const id of ["psm", "digits", "invert"]) $(id).addEventListener("change", read);

// ---------- the result ----------
function format() {                                // from the text box to a plain block, a column or a row
  const layout = document.querySelector("input[name=layout]:checked").value, unit = $("unit").value, tidy = $("tidy").checked, skip = $("skip").checked;
  let lines = $("raw").value.replace(/\r/g, "").split("\n");
  if (tidy) lines = lines.map(l => l.replace(/[ \t]+/g, " ").trim()); else lines = lines.map(l => l.replace(/\s+$/, ""));
  if (skip || layout !== "asis") lines = lines.filter(l => l.trim() !== "");
  let out;
  if (layout === "asis") out = lines.join("\n");
  else {
    const items = unit === "words" ? lines.join(" ").split(/\s+/).filter(Boolean) : lines;
    out = layout === "col" ? items.join("\n") : items.join({ tab: "\t", comma: ",", space: " " }[$("sep").value]);
    $("count").textContent = items.length + (items.length === 1 ? " item" : " items");
  }
  if (layout === "asis") { const n = lines.filter(l => l.trim()).length; $("count").textContent = n + (n === 1 ? " line" : " lines"); }
  $("out").value = out; $("copy").disabled = !out;
  $("opts").style.opacity = layout === "asis" ? .5 : 1; $("sep").disabled = layout !== "row"; $("unit").disabled = layout === "asis";
  if (!out) $("count").textContent = "";
}
for (const id of ["raw", "unit", "sep", "tidy", "skip"]) $(id).addEventListener(id === "raw" ? "input" : "change", format);
document.querySelectorAll("input[name=layout]").forEach(r => r.addEventListener("change", format));

$("copy").onclick = async () => {
  const t = $("out").value; let ok = false;
  try { await navigator.clipboard.writeText(t); ok = true; } catch (e) { $("out").select(); try { ok = document.execCommand("copy"); } catch (e2) {} }
  const b = $("copy"); b.textContent = ok ? "Copied ✓" : "Press Ctrl + C"; b.classList.toggle("ok", ok); setTimeout(() => { b.textContent = "Copy"; b.classList.remove("ok"); }, 1600);
};
$("clear").onclick = () => {
  if (shot) URL.revokeObjectURL(shot.url); shot = null; again = false;
  $("preview").hidden = true; $("preview").removeAttribute("src"); $("picHint").hidden = false; $("raw").value = ""; say(""); format();
};
format();
</script>
</body>
</html>
